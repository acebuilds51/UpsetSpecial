    if (newPin !== confirm) { showToast('New PINs do not match', 'error'); return; }
    if (newPin === current) { showToast('New PIN must be different from current PIN', 'error'); return; }
    const btn = document.getElementById('change-pin-btn');
    btn.innerHTML = '<span class="spinner" style="border-top-color:#1A1206;"></span>';
    try {
      await api('changePin', { playerId: p.id, currentPin: current, newPin });
      showToast('PIN updated successfully', 'success');
      ['pin-current','pin-new','pin-confirm'].forEach(id => document.getElementById(id).value = '');
      btn.textContent = 'Update PIN';
    } catch(e) { showToast(e.message || 'Could not update PIN', 'error'); btn.textContent = 'Update PIN'; }
  };

  // --- Refer copy/share ---
  document.getElementById('profile-copy-btn').onclick = async () => {
    try {
      await navigator.clipboard.writeText(referMsg);
      const btn = document.getElementById('profile-copy-btn');
      btn.textContent = '✓ Copied!';
      setTimeout(() => { if (btn) btn.textContent = '📋 Copy'; }, 2000);
    } catch(e) { showToast('Copy failed', 'error'); }
  };
  document.getElementById('profile-share-btn').onclick = async () => {
    if (navigator.share) { try { await navigator.share({ text: referMsg }); } catch(e) {} }
    else { window.open('sms:?body=' + encodeURIComponent(referMsg)); }
  };

  // --- Notification toggle ---
  const notifToggleBtn = document.getElementById('notif-toggle-btn');
  if (notifToggleBtn) {
    notifToggleBtn.onclick = async () => {
      if (State.player.fcmToken) {
        await unregisterPushNotifications(p.id);
      } else {
        await registerForPushNotifications(p.id);
      }
      await refreshState();
      renderProfile(content);
    };
  }

  // --- Chat notif toggle ---
  const chatNotifBtn = document.getElementById('chat-notif-btn');
  if (chatNotifBtn) {
    chatNotifBtn.onclick = async () => {
      const newVal = (State.player.chatNotif || 'off') === 'on' ? 'off' : 'on';
      await api('updateProfile', { playerId: p.id, chatNotif: newVal });
      State.player.chatNotif = newVal;
      chatNotifBtn.textContent = newVal === 'on' ? 'On' : 'Off';
      chatNotifBtn.className = `btn ${newVal === 'on' ? 'btn-primary' : 'btn-ghost'} btn-sm`;
      showToast('General chat notifications ' + (newVal === 'on' ? 'enabled' : 'disabled'), 'success');
    };
  }

  // --- Score preference ---
  const saveScorePrefBtn = document.getElementById('save-score-pref-btn');
  if (saveScorePrefBtn) {
    saveScorePrefBtn.onclick = async () => {
      const selected = document.querySelector('input[name="score-pref"]:checked');
      if (!selected) return;
      const btn = saveScorePrefBtn;
      btn.innerHTML = '<span class="spinner" style="border-top-color:#1A1206;"></span>';
      try {
        await api('updateProfile', { playerId: p.id, scoreNotif: selected.value });
        State.player.scoreNotif = selected.value;
        showToast('Score notification preference saved', 'success');
        btn.textContent = 'Save Score Preference';
      } catch(e) {
        showToast('Could not save preference', 'error');
        btn.textContent = 'Save Score Preference';
      }
    };
  }

  // --- Log out ---
  document.getElementById('profile-logout-btn').onclick = () => {
    if (confirm('Log out of your account?')) logout();
  };

  // --- Name Claims: load my existing claims ---
  async function loadMyClaims() {
    const el = document.getElementById('claim-my-claims');
    try {
      const data = await api('getMyNameClaims', { playerId: p.id });
      const claims = data.claims || [];
      if (!claims.length) {
        el.innerHTML = '<p style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">You have no pending or approved claims.</p>';
        return;
      }
      el.innerHTML = claims.map(c => {
        const badgeColor = c.status === 'approved' ? 'var(--green)' : c.status === 'rejected' ? 'var(--red)' : 'var(--text-soft)';
        const badge = `<span style="font-size:11px;font-weight:700;color:${badgeColor};text-transform:uppercase;">${c.status}</span>`;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--hairline);">
          <div>
            <div style="font-size:13px;font-weight:600;color:var(--text);">${escapeHtml(c.claimedTeamName)}</div>
            <div style="font-size:11px;color:var(--text-soft);">Submitted ${new Date(c.submittedAt).toLocaleDateString()}</div>
          </div>
          ${badge}
        </div>`;
      }).join('');
    } catch(e) {
      el.innerHTML = '<p style="font-size:12px;color:var(--text-muted);">Could not load claims.</p>';
    }
  }
  loadMyClaims();

  // --- Browse & submit claim ---
  document.getElementById('claim-browse-btn').onclick = async () => {
    const btn = document.getElementById('claim-browse-btn');
    btn.disabled = true;
    btn.textContent = 'Loading...';
    try {
      const data = await api('getClaimableNames', { playerId: p.id });
      const claimable = data.claimable || [];
      btn.style.display = 'none';

      if (!claimable.length) {
        document.getElementById('claim-my-claims').insertAdjacentHTML('afterend',
          '<p style="font-size:13px;color:var(--text-soft);margin-top:8px;">No unlinked historical team names found.</p>');
        return;
      }

      const listEl = document.createElement('div');
      listEl.id = 'claim-list';
      listEl.innerHTML = `
        <p style="font-size:12px;color:var(--text-soft);margin-bottom:10px;">Select a historical team name that was yours. You'll be asked for a brief reason so Jeff can verify.</p>
        <div style="max-height:240px;overflow-y:auto;border:1px solid var(--hairline);border-radius:var(--radius-sm);">
          ${claimable.map(c => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--hairline);">
              <div>
                <div style="font-size:13px;font-weight:600;color:var(--text);">${escapeHtml(c.teamName)}</div>
                <div style="font-size:11px;color:var(--text-soft);">${c.seasons} season${c.seasons!==1?'s':''} · ${c.years.join(', ')}</div>
              </div>
              <button class="btn btn-secondary btn-sm claim-select-btn" data-name="${escapeHtml(c.teamName)}" style="white-space:nowrap;flex-shrink:0;">Claim</button>
            </div>`).join('')}
        </div>`;
      btn.parentNode.insertBefore(listEl, btn);

      listEl.querySelectorAll('.claim-select-btn').forEach(b => {
        b.onclick = () => {
          const name = b.dataset.name;
          const reason = prompt(`Why are you claiming "${name}"?\n\nTell Jeff how he can verify this was your team (e.g. "I used this name in 2018-2019 before changing to my current name"):`);
          if (reason === null) return;
          if (!reason.trim()) { showToast('Please provide a reason', 'error'); return; }
          b.disabled = true; b.textContent = 'Submitting...';
          api('submitNameClaim', { playerId: p.id, claimedTeamName: name, reason: reason.trim() })
            .then(res => {
              if (res.ok) {
                showToast('Claim submitted! Jeff will review it shortly.', 'success');
                b.textContent = 'Pending';
                b.disabled = true;
                loadMyClaims();
              } else {
                showToast(res.error || 'Could not submit claim', 'error');
                b.disabled = false; b.textContent = 'Claim';
              }
            }).catch(() => { showToast('Network error', 'error'); b.disabled=false; b.textContent='Claim'; });
        };
      });
    } catch(e) {
      showToast('Could not load claimable names', 'error');
      btn.disabled = false;
      btn.textContent = 'Browse Claimable Team Names';
    }
  };

  // --- Bio: load existing data and wire handlers ---
  api('getTrophyRoom', { playerId: p.id }).then(data => {
    const bio = data.bio || {};
    const fields = ['hometown','college','favTeam','firstGame','favGame','favPlayer','favUpset','strategy','occupation','funFact'];
    fields.forEach(f => {
      const el = document.getElementById('bio-' + f);
      if (el && bio[f]) el.value = bio[f];
    });
  }).catch(() => {});

  document.getElementById('bio-generate-btn').onclick = async () => {
    const btn = document.getElementById('bio-generate-btn');
    const fields = ['hometown','college','favTeam','firstGame','favGame','favPlayer','favUpset','strategy','occupation','funFact'];
    const answers = {};
    fields.forEach(f => {
      const el = document.getElementById('bio-' + f);
      if (el && el.value.trim()) answers[f] = el.value.trim();
    });
    if (Object.keys(answers).length < 3) { showToast('Fill in at least 3 fields to generate a bio', 'error'); return; }

    btn.innerHTML = '<span class="spinner" style="border-top-color:#1A1206;"></span> Generating...';
    btn.disabled = true;

    // Build prompt for Claude
    const prompt = `You are writing a fun, witty, third-person bio paragraph for a fantasy college football pick'em league called Upset Special. The player has been in this league since ${p.joinedSeason || 'its founding'}. Write ONE paragraph (3-5 sentences) in a warm, slightly irreverent sports-bar voice. Use their answers to craft something personal and entertaining. Do not use their real name — refer to them by their team name "${p.teamName}". Here are their answers:\n${Object.entries(answers).map(([k,v]) => `- ${k}: ${v}`).join('\n')}\nWrite only the bio paragraph, no quotes or preamble.`;

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 300,
          messages: [{ role: 'user', content: prompt }]
        })
      });
      const result = await response.json();
      const bioText = result.content && result.content[0] && result.content[0].text ? result.content[0].text.trim() : '';
      if (bioText) {
        const preview = document.getElementById('bio-preview');
        preview.textContent = bioText;
        preview.style.display = 'block';
        // store for save
        preview.dataset.bioText = bioText;
        showToast('Bio generated! Review it and tap Save.', 'success');
      }
    } catch(e) {
      showToast('Could not generate bio: ' + e.message, 'error');
    } finally {
      btn.innerHTML = '✨ Generate Bio with AI';
      btn.disabled = false;
    }
  };

  document.getElementById('bio-save-btn').onclick = async () => {
    const fields = ['hometown','college','favTeam','firstGame','favGame','favPlayer','favUpset','strategy','occupation','funFact'];
    const payload = { playerId: p.id, email: p.email || '' };
    fields.forEach(f => {
      const el = document.getElementById('bio-' + f);
      if (el) payload[f] = el.value.trim();
    });
    const preview = document.getElementById('bio-preview');
    if (preview && preview.dataset.bioText) payload.bioText = preview.dataset.bioText;

    const btn = document.getElementById('bio-save-btn');
    btn.innerHTML = '<span class="spinner" style="border-top-color:#1A1206;"></span>';
    try {
      await api('saveBio', payload);
      _trophyRoomCache = {}; // clear cache so trophy room reloads fresh
      showToast('Bio saved ✓', 'success');
      btn.textContent = 'Save Bio';
    } catch(e) {
      showToast('Could not save bio', 'error');
      btn.textContent = 'Save Bio';
    }
  };
}

let _liveScoresCache = null;
let _liveScoresLoading = false;

async function renderLiveScores(content) {

  content.innerHTML = `

function renderScoreRow(g, isBoard) {
  const result = computeGameResult(g);
  const dog = underdogOf(g);
  const started = isGameStarted(g);
  const final = isGameFinal(g);

  const awayScore = final || started ? (g.finalAwayScore || g.awayScore || '') : '';
  const homeScore = final || started ? (g.finalHomeScore || g.homeScore || '') : '';

  const awayWon = final && Number(awayScore) > Number(homeScore);
  const homeWon = final && Number(homeScore) > Number(awayScore);
  const awayIsUpset = awayWon && g.favorite === g.homeTeam;
  const homeIsUpset = homeWon && g.favorite === g.awayTeam;

  const status = final ? 'Final' : started ? 'Live' : g.kickoff ? new Date(g.kickoff).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : 'TBD';
  const statusColor = final ? 'var(--text-faint)' : started ? 'var(--win)' : 'var(--text-faint)';

  const spread = g.spread ? (g.favorite === g.awayTeam ? `-${fmtSpread(g.spread)}` : `+${fmtSpread(g.spread)}`) : '';
  const homeSpread = g.spread ? (g.favorite === g.homeTeam ? `-${fmtSpread(g.spread)}` : `+${fmtSpread(g.spread)}`) : '';

  return `
    <div style="padding:10px 14px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:8px; ${isBoard ? 'background:rgba(255,184,0,0.03);' : ''}">
      ${isBoard ? '<div style="width:8px; height:8px; border-radius:50%; background:var(--gold); flex-shrink:0;"></div>' : '<div style="width:8px;"></div>'}
      <div style="flex:1; min-width:0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;">
          <span style="font-size:13px; font-weight:${awayWon ? '700' : '400'}; color:${awayIsUpset ? 'var(--gold)' : awayWon ? 'var(--text)' : 'var(--text-soft)'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%;">${escapeHtml(g.awayTeam)}${awayIsUpset ? ' 🚨' : ''} <span style="font-size:11px; color:var(--text-faint);">${spread}</span></span>
          <span class="mono" style="font-size:15px; font-weight:700; color:${awayWon ? 'var(--text)' : 'var(--text-faint)'};">${awayScore}</span>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:13px; font-weight:${homeWon ? '700' : '400'}; color:${homeIsUpset ? 'var(--gold)' : homeWon ? 'var(--text)' : 'var(--text-soft)'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:55%;">${escapeHtml(g.homeTeam)}${homeIsUpset ? ' 🚨' : ''} <span style="font-size:11px; color:var(--text-faint);">${homeSpread}</span></span>
          <span class="mono" style="font-size:15px; font-weight:700; color:${homeWon ? 'var(--text)' : 'var(--text-faint)'};">${homeScore}</span>
        </div>
      </div>
      <div style="text-align:right; flex-shrink:0; min-width:40px;">
        <div style="font-size:10px; font-weight:700; color:${statusColor}; text-transform:uppercase;">${status}</div>
      </div>
    </div>
  `;
}

async function loadAllEspnScores(week) {
  const container = document.getElementById('all-scores-container');
  if (!container) return;

  if (_liveScoresCache) {
    renderAllScores(container, _liveScoresCache);
    return;
  }

  try {
    const data = await api('getAllEspnScores', { week });
    _liveScoresCache = data.games || [];
    renderAllScores(container, _liveScoresCache);
  } catch(e) {
    if (container) container.innerHTML = `<div class="empty-state"><p>Could not load ESPN scores. ${e.message}</p></div>`;
  }
}

function renderAllScores(container, games) {
  if (!container) return;
  const boardIds = new Set(getGamesForWeek(currentWeek()).map(g => g.espnEventId));

  // separate board games (already shown above) from rest
  const otherGames = games.filter(g => !boardIds.has(g.espnEventId));

  if (otherGames.length === 0) {
    container.innerHTML = '<div class="empty-state"><p class="helptext">No other FBS games found for this week.</p></div>';
    return;
  }

  // group by status: live first, then upcoming, then final
  const live     = otherGames.filter(g => g.status === 'in' || g.status === 'live');
  const upcoming = otherGames.filter(g => g.status === 'pre' || g.status === 'upcoming');
  const final    = otherGames.filter(g => g.status === 'post' || g.status === 'final');

  const sections = [
    { label: '🔴 Live', games: live },
    { label: 'Upcoming', games: upcoming },
    { label: 'Final', games: final }
  ].filter(s => s.games.length > 0);

  container.innerHTML = sections.map(s => `
    <div class="section-label" style="margin-top:8px;">${s.label} (${s.games.length})</div>
    <div class="card" style="padding:0; overflow:hidden;">
      ${s.games.map(g => renderScoreRow(g, false)).join('')}
    </div>
  `).join('');
}

   ============================================================ */
function renderMoney(content) {
  const entryFee = Number(State.season.entryFee || 0);
  const weeklyPrize = Number(State.season.weeklyPrize || 0);
  const perfectBonus = Number(State.season.perfectWeekBonus || 0);
  const pct1 = Number(State.season.seasonPayout1stPct || 0);
  const pct2 = Number(State.season.seasonPayout2ndPct || 0);
  const pct3 = Number(State.season.seasonPayout3rdPct || 0);
  const activePlayers = State.players.filter(p => p.active);
  const totalPot = entryFee * activePlayers.length;

  const balances = activePlayers.map(p => {
    const entries = State.ledger.filter(l => l.playerId === p.id);
    const paid = entries.filter(e => e.type === 'paid').reduce((sum, e) => sum + Number(e.amount), 0);
    const payouts = entries.filter(e => e.type === 'payout' || e.type === 'weekly_prize' || e.type === 'perfect_bonus').reduce((sum, e) => sum + Number(e.amount), 0);
    const owed = Math.max(entryFee - paid, 0);
    return { ...p, paid, payouts, owed };
  });

  const totalCollected = balances.reduce((sum, b) => sum + b.paid, 0);
  const totalOwed = balances.reduce((sum, b) => sum + b.owed, 0);
  const totalPaidOut = balances.reduce((sum, b) => sum + b.payouts, 0);

  content.innerHTML = `
    <div class="card" style="background:var(--surface-3); color:#fff;">
      <div style="display:flex; gap:14px;">
        <div style="flex:1; text-align:center;">
          <div class="mono" style="font-size:22px; font-weight:700;">$${totalPot}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.6); text-transform:uppercase; letter-spacing:0.04em;">Full Pot</div>
        </div>
        <div style="flex:1; text-align:center; border-left:1px solid rgba(255,255,255,0.15); border-right:1px solid rgba(255,255,255,0.15);">
          <div class="mono" style="font-size:22px; font-weight:700; color:var(--win);">$${totalCollected}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.6); text-transform:uppercase; letter-spacing:0.04em;">Collected</div>
        </div>
        <div style="flex:1; text-align:center;">
          <div class="mono" style="font-size:22px; font-weight:700; color:${totalOwed > 0 ? '#E8B4AC' : 'var(--win)'};">$${totalOwed}</div>
          <div style="font-size:10px; color:rgba(255,255,255,0.6); text-transform:uppercase; letter-spacing:0.04em;">Outstanding</div>
        </div>
      </div>
    </div>
    <div class="section-label">Prize Structure</div>
    <div class="card">
      <p class="helptext"><strong style="color:var(--text)">Weekly:</strong> $${weeklyPrize} to the week's high scorer (split evenly on ties).</p>
      <p class="helptext" style="margin-top:6px;"><strong style="color:var(--text)">Perfect Week Bonus:</strong> $${perfectBonus} to anyone who gets all 10 straight picks correct.</p>
      <p class="helptext" style="margin-top:6px;"><strong style="color:var(--text)">Season-End:</strong> 1st ${pct1}% &middot; 2nd ${pct2}% &middot; 3rd ${pct3}% of the full pot.</p>
      <p class="helptext" style="margin-top:8px;">Total paid out so far: <span class="mono">$${totalPaidOut}</span></p>
    </div>
    <div class="section-label">Buy-In Status &middot; $${entryFee}/player</div>
    <div class="card">
      <table class="simple">
        <thead><tr><th>Team</th><th>Paid</th><th>Owed</th></tr></thead>
        <tbody>
          ${balances.map(b => `
            <tr>
              <td>${escapeHtml(b.teamName || b.name)}${b.id === State.player.id ? ' <span style="color:var(--text-soft); font-size:11px;">(you)</span>' : ''}</td>
              <td class="mono">$${b.paid}</td>
              <td class="mono" style="color:${b.owed > 0 ? 'var(--loss)' : 'var(--win)'};">${b.owed > 0 ? '$' + b.owed : 'Paid'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

<script>

let _bowlDraftPicks = {};  // gameId -> {pickedTeam, isUpset}
let _bowlUpsetGameIds = []; // tracks which 2 games are flagged upset (round1 only)

const BOWL_PHASE_POINTS = { round1: 1, quarter: 3, semi: 4, champion: 5 };

function getBowlGamesForPhase(phase) { return (State.bowlGames || []).filter(g => g.phase === phase); }
function isBowlPhasePosted(phase) {
  const games = getBowlGamesForPhase(phase);
  return games.length > 0 && games.every(isGameLocked);
}

function getMyBowlChampionPick() { return (State.bowlChampion || []).find(c => c.playerId === State.player.id); }

   ============================================================ */
/* ============================================================
   TROPHY ROOM — modal overlay, tap any player name to open
   ============================================================ */
let _trophyRoomCache = {};

function openTrophyRoom(playerId) {
  // create modal if not exists
  let modal = document.getElementById('trophy-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'trophy-modal';
    modal.style.cssText = 'position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.85);overflow-y:auto;display:none;';
    modal.innerHTML = `
      <div id="trophy-modal-inner" style="max-width:480px;margin:0 auto;padding:16px 12px 40px;">
        <div style="display:flex;justify-content:flex-end;margin-bottom:8px;">
          <button onclick="document.getElementById('trophy-modal').style.display='none'" 
            style="background:var(--surface-2);border:none;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;color:var(--text);line-height:1;">✕</button>
        </div>
        <div id="trophy-modal-content">
          <div class="empty-state"><span class="spinner"></span></div>
        </div>
      </div>`;
    document.body.appendChild(modal);
    modal.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };
  }
  modal.style.display = 'block';
  modal.scrollTop = 0;
  loadTrophyRoom(playerId);
}

async function loadTrophyRoom(playerId) {
  const inner = document.getElementById('trophy-modal-content');
  if (!inner) return;

  if (_trophyRoomCache[playerId]) {
    renderTrophyRoomContent(inner, _trophyRoomCache[playerId]);
    return;
  }

  inner.innerHTML = '<div class="empty-state"><span class="spinner"></span><p style="margin-top:12px;">Loading Trophy Room...</p></div>';

  try {
    const data = await api('getTrophyRoom', { playerId });
    _trophyRoomCache[playerId] = data;
    renderTrophyRoomContent(inner, data);
  } catch(e) {
    inner.innerHTML = `<div class="empty-state"><p>Could not load Trophy Room.</p></div>`;
  }
}

function renderTrophyRoomContent(el, data) {
  const p = data.player;
  const isMe = State.player && State.player.id === p.id;
  const bio = data.bio || {};

  // ── Trophy case cubby layout ─────────────────────────────
  // Sort newest first. Split by type. Each section: min 3 cubbies,
  // up to 4 per row; if > 4 trophies a new row starts.
  function buildCubbies(trophies, type) {
    // Sort newest first
    const sorted = [...trophies].sort((a,b) => b.year - a.year || a.position - b.position);
    if (!sorted.length) return '';

    const CUBBY_H = 180; // px per row height
    const rows = [];
    let i = 0;
    while (i < sorted.length) {
      // How many go in this row?
      const remaining = sorted.length - i;
      const perRow = remaining <= 4 ? Math.max(remaining, 3) : 4;
      rows.push(sorted.slice(i, i + perRow));
      i += perRow;
    }

    const PAL = {
      1: { body:'#D4A017', mid:'#9A7010', dark:'#3A2800', fb:'#D4A017', label:'Champion', blabel:'1ST PLACE' },
      2: { body:'#C8C8DC', mid:'#8888A0', dark:'#282838', fb:'#C8C8DC', label:'Runner-up', blabel:'2ND PLACE' },
      3: { body:'#C04A00', mid:'#7A2E00', dark:'#2A1000', fb:'#C04A00', label:'3rd Place', blabel:'3RD PLACE' },
    };

    const caseId = `tc-${type}-${Date.now()}-${Math.random().toString(36).slice(2,6)}`;

    const rowHtml = rows.map((row, ri) => {
      const n = row.length;
      const canvasId = `${caseId}-r${ri}`;
      const pct = 100 / n;

      const labels = row.map((t, ci) => {
        const pal = PAL[t.position] || PAL[3];
        const color = t.position===1?'#FFD700':t.position===2?'#E8E8E8':'#CD7F32';
        const sub = t.position===1?'#B8860B':t.position===2?'#A0A0A0':'#A05030';
        const sublabel = type==='season' ? pal.label : pal.blabel;
        return `<div style="width:${pct}%;text-align:center;border-left:${ci>0?'1px solid rgba(200,150,12,0.25)':'none'};">
          <div style="font-size:8px;font-weight:700;color:${color};margin-top:3px;">${t.year}</div>
          <div style="font-size:7px;color:${sub};">${sublabel}</div>
          <div style="height:10px;background:linear-gradient(180deg,#A06830,#7A5230 35%,#5C3D1A 68%,#3D2808);border-radius:2px;margin-top:2px;box-shadow:0 3px 8px rgba(0,0,0,.6);"></div>
        </div>`;
      }).join('');

      // Store row data for Three.js init
      const rowData = JSON.stringify(row.map(t => ({
        pos: t.position,
        type: type
      })));

      return `
        <div style="position:relative;border-top:${ri>0?'1px solid rgba(200,150,12,0.18)':'none'};">
          <canvas id="${canvasId}" width="800" height="${CUBBY_H*2}"
            style="display:block;width:100%;height:${CUBBY_H}px;position:relative;z-index:3;"
            data-row='${rowData}' data-n="${n}"></canvas>
          <div style="display:flex;position:relative;z-index:3;">
            ${labels}
          </div>
        </div>`;
    }).join('');

    return `
      <div id="${caseId}" style="
        border-radius:0 0 6px 6px;
        background:repeating-linear-gradient(88deg,transparent 0,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 4px,transparent 4px,transparent 10px,rgba(255,255,255,.05) 10px,rgba(255,255,255,.05) 11px,transparent 11px,transparent 18px),
        linear-gradient(180deg,#2e1500,#5C3310 15%,#6B3D14 30%,#7A4718 45%,#6B3D14 60%,#5C3310 75%,#6B3D14 88%,#5C3310);
      ">
        ${rowHtml}
      </div>`;
  }

  const seasonTrophies = data.trophies || [];
  const bowlTrophies   = data.bowlTrophies || [];
  const hasSeason      = seasonTrophies.length > 0;
  const hasBowl        = bowlTrophies.length > 0;
  const hasTrophies    = hasSeason || hasBowl;
  const hasAny         = hasTrophies;

  // Case shell HTML — wood top/sides/bottom wrap
  function caseWrap(inner) {
    return `
    <div style="border-radius:10px 10px 8px 8px;overflow:hidden;margin-bottom:10px;box-shadow:0 8px 22px rgba(0,0,0,.7);">
      <div style="height:22px;background:linear-gradient(180deg,#150800,#3a1c00 30%,#6B3D14 60%,#8B5020 80%,#7A4718);"></div>

  const trophyHtml = hasTrophies ? `

  // Perfect week banner
  const perfectHtml = data.perfectWeeks && data.perfectWeeks.length > 0 ? data.perfectWeeks.map(pw => `
    <div style="background:linear-gradient(135deg,#7c2d00,#c2410c,#FFB800,#FF6B35);border:1.5px solid #FF6B35;border-radius:12px;padding:1rem 1.25rem;text-align:center;animation:pulse-orange 2s ease-in-out infinite;position:relative;overflow:hidden;margin-bottom:8px;">

        <span style="font-size:14px;animation:spin-slow 8s linear infinite;display:inline-block;color:#1A1206;">✦</span>

        <span style="font-size:14px;animation:spin-slow 8s linear infinite;display:inline-block;color:#1A1206;animation-delay:-5.3s;">✦</span>
      </div>
      <div style="font-size:26px;margin-bottom:4px;position:relative;z-index:1;">💯</div>
      <div style="font-size:15px;font-weight:700;color:#1A1206;position:relative;z-index:1;">Perfect Week</div>
      <div style="font-size:12px;color:rgba(26,18,6,0.8);margin-top:3px;position:relative;z-index:1;">10 / 10 correct · Week ${pw.week}, ${pw.year}</div>
      ${data.leaguePerfectCount > 0 ? `<div style="font-size:11px;color:rgba(26,18,6,0.55);margin-top:5px;position:relative;z-index:1;">One of only ${data.leaguePerfectCount} ever in league history</div>` : ''}
    </div>`).join('') : '';

  // About table
  const aboutRows = [
    ['Lives in', bio.hometown],

    ['Favorite player all-time', bio.favPlayer],

  el.innerHTML = `

      @keyframes pulse-orange { 0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,0)} 50%{box-shadow:0 0 18px 6px rgba(255,107,53,0.3)} }
      @keyframes pulse-gold { 0%,100%{box-shadow:0 0 0 0 rgba(234,179,8,0)} 50%{box-shadow:0 0 16px 5px rgba(234,179,8,0.3)} }
      @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
      @keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    </style>

    <!-- Header -->
    <div style="display:flex;justify-content:space-between;align-items:flex-start;background:var(--surface-2);border:1px solid var(--hairline);border-radius:12px;padding:14px;margin-bottom:10px;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        ${avatarHtml}
        <span style="font-size:10px;color:var(--text-faint);">Avatar</span>
      </div>
      <div style="flex:1;text-align:center;padding:0 12px;">
        <div style="font-size:16px;font-weight:700;color:var(--text);">${escapeHtml(p.teamName)}</div>
        <div style="font-size:12px;color:var(--text-faint);margin-top:2px;">${escapeHtml(p.name)}</div>
        ${bio.hometown ? `<div style="font-size:12px;color:var(--text-faint);">${escapeHtml(bio.hometown)}</div>` : ''}
        ${bio.college ? `<div style="font-size:12px;color:var(--text-faint);">${escapeHtml(bio.college)}</div>` : ''}
        <div style="font-size:11px;color:var(--text-faint);margin-top:2px;">In league since ${p.joinedSeason || ''}</div>

// ── 3D Trophy canvas renderer ────────────────────────────────────────────────
function initTrophyCanvases(el) {
  if (typeof THREE === 'undefined') {
    // Load Three.js if not present
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s.onload = () => initTrophyCanvases(el);
    document.head.appendChild(s);
    return;
  }

  const canvases = el.querySelectorAll('canvas[data-row]');
  if (!canvases.length) return;

  const PAL = {
    1: { body:0xD4A017, mid:0x9A7010, dark:0x3A2800, fb:0xD4A017 },
    2: { body:0xC8C8DC, mid:0x8888A0, dark:0x282838, fb:0xC8C8DC },
    3: { body:0xC04A00, mid:0x7A2E00, dark:0x2A1000, fb:0xC04A00 },
  };

  function mm(hex) { return new THREE.MeshStandardMaterial({color:hex,roughness:0.12,metalness:0.88,emissive:hex,emissiveIntensity:0.16}); }
  function mm2(hex){ return new THREE.MeshStandardMaterial({color:hex,roughness:0.22,metalness:0.84,emissive:hex,emissiveIntensity:0.08}); }
  const BLK = new THREE.MeshStandardMaterial({color:0x080808,roughness:0.4,metalness:0.5});
  const WHT = new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.8,metalness:0.0});

  function mkScene() {
    const s = new THREE.Scene();
    s.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xfff5e0, 2.4); sun.position.set(3,10,8); s.add(sun);
    s.add(Object.assign(new THREE.DirectionalLight(0xbbccff,0.4),{position:new THREE.Vector3(-7,4,5)}));
    s.add(Object.assign(new THREE.DirectionalLight(0xffffff,0.55),{position:new THREE.Vector3(7,5,-3)}));
    s.add(Object.assign(new THREE.DirectionalLight(0xffeedd,0.25),{position:new THREE.Vector3(0,-5,5)}));
    return s;
  }

  function mkCFP(pal) {
    const g = new THREE.Group();
    const bdy=mm(pal.body), mid=mm2(pal.mid), drk=mm2(pal.dark), fbm=mm(pal.fb);
    fbm.roughness=0.2; fbm.metalness=0.82;
    const pts=[]; for(let i=0;i<=28;i++){const a=i/28*Math.PI;pts.push(new THREE.Vector2(Math.sin(a)*.46,Math.cos(a)*.66));}
    const fb=new THREE.Mesh(new THREE.LatheGeometry(pts,32),fbm); fb.position.y=2.62; g.add(fb);
    const lb=new THREE.Mesh(new THREE.BoxGeometry(.06,.52,.06),WHT); lb.position.set(.34,2.62,.35); g.add(lb);
    for(let j=-2;j<=2;j++){const ls=new THREE.Mesh(new THREE.BoxGeometry(.17,.04,.05),WHT);ls.position.set(.28,2.62+j*.1,.37);ls.rotation.y=.25;g.add(ls);}
    const fG=new THREE.CylinderGeometry(.11,.84,.17,6);
    [[-0.34,-0.28],[0.34,0.28]].forEach(([x,rz])=>{const f=new THREE.Mesh(fG,bdy);f.position.set(x,1.82,0);f.rotation.z=rz;g.add(f);});
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,.13,22),bdy),{position:new THREE.Vector3(0,1.80,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.21,.33,.40,16),mid),{position:new THREE.Vector3(0,1.46,0)}));
    const cG=new THREE.CylinderGeometry(.18,.36,2.05,18), sG=new THREE.BoxGeometry(.09,2.05,.42);
    [[-0.42,0.14],[0.42,-0.14]].forEach(([x,rz])=>{
      const col=new THREE.Mesh(cG,bdy); col.position.set(x,.15,0); col.rotation.z=rz; g.add(col);
      const sl=new THREE.Mesh(sG,drk); sl.position.set(x-Math.sign(x)*.28,.15,0); sl.rotation.z=rz; g.add(sl);
    });
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.21,.29,.27,16),mid),{position:new THREE.Vector3(0,-.82,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.68,.80,.21,8),BLK),{position:new THREE.Vector3(0,-1.05,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1.38,.29,.70),BLK),{position:new THREE.Vector3(0,-1.32,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1.58,.20,.80),BLK),{position:new THREE.Vector3(0,-1.54,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(1.42,.05,.74),mid),{position:new THREE.Vector3(0,-1.18,0)}));
    return g;
  }

  function mkShield(pal, label) {
    const g = new THREE.Group();
    const edg = mm(pal.body);
    const rb=(pal.body>>16)&0xff, gb=(pal.body>>8)&0xff, bb=pal.body&0xff;
    function mkTex(isFront) {
      const CW=512,CH=680,cv=document.createElement('canvas');
      cv.width=CW; cv.height=CH;
      const ctx=cv.getContext('2d'); ctx.clearRect(0,0,CW,CH);
      function clip(pad){
        const x=pad,y=pad,ew=CW-pad*2,eh=CH-pad*2;
        ctx.beginPath();
        ctx.moveTo(x+ew*.12,y); ctx.lineTo(x+ew*.88,y);
        ctx.quadraticCurveTo(x+ew,y,x+ew,y+eh*.12);
        ctx.lineTo(x+ew,y+eh*.52);
        ctx.quadraticCurveTo(x+ew,y+eh*.78,CW/2,y+eh);
        ctx.quadraticCurveTo(x,y+eh*.78,x,y+eh*.52);
        ctx.lineTo(x,y+eh*.12);
        ctx.quadraticCurveTo(x,y,x+ew*.12,y);
        ctx.closePath();
      }
      ctx.save(); clip(0); ctx.clip();
      ctx.fillStyle=`rgb(${rb},${gb},${bb})`; ctx.fillRect(0,0,CW,CH);
      ctx.restore();
      if (isFront) {
        ctx.save(); clip(28); ctx.clip();
        ctx.fillStyle='rgba(0,0,0,0.78)'; ctx.fillRect(0,0,CW,CH);
        ctx.restore();
        ctx.save(); clip(28); ctx.clip();
        ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.font='900 148px Arial Black,sans-serif'; ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=10;
        ctx.fillText('BOWL',CW/2,CH*.27);
        ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(55,CH*.46); ctx.lineTo(CW-55,CH*.46); ctx.stroke();
        ctx.font='700 76px Arial Black,sans-serif'; ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.shadowBlur=8; ctx.shadowColor='rgba(0,0,0,0.5)';
        ctx.fillText('BONANZA',CW/2,CH*.60);
        ctx.restore();
      } else {
        ctx.save(); clip(0); ctx.clip(); ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(0,0,CW,CH); ctx.restore();
        ctx.save(); clip(28); ctx.clip(); ctx.fillStyle='rgba(0,0,0,0.88)'; ctx.fillRect(0,0,CW,CH); ctx.restore();
        ctx.save(); clip(28); ctx.clip();
        ctx.textAlign='center'; ctx.textBaseline='middle';
        const [num,plc] = label.split(' ');
        ctx.font='900 160px Arial Black,sans-serif'; ctx.fillStyle=`rgb(${rb},${gb},${bb})`; ctx.shadowColor='#fff'; ctx.shadowBlur=24;
        ctx.fillText(num,CW/2,CH*0.26); ctx.shadowBlur=0;
        ctx.font='900 120px Arial Black,sans-serif'; ctx.fillStyle='#fff';
        ctx.fillText(plc,CW/2,CH*0.48);
        ctx.strokeStyle='rgba(255,255,255,0.35)'; ctx.lineWidth=4;
        ctx.beginPath(); ctx.moveTo(60,CH*.60); ctx.lineTo(CW-60,CH*.60); ctx.stroke();
        ctx.font='600 58px Arial,sans-serif'; ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.shadowBlur=6; ctx.shadowColor='rgba(0,0,0,0.5)';
        ctx.fillText('Bowl Bonanza',CW/2,CH*0.72);
        ctx.restore();
      }
      const t=new THREE.CanvasTexture(cv); t.needsUpdate=true; return t;
    }
    const shW=2.1, shH=shW*(680/512);
    const fMat=new THREE.MeshStandardMaterial({color:0xffffff,map:mkTex(true), transparent:true,alphaTest:0.1,roughness:0.1,metalness:0.5,side:THREE.FrontSide});
    const bMat=new THREE.MeshStandardMaterial({color:0xffffff,map:mkTex(false),transparent:true,alphaTest:0.1,roughness:0.1,metalness:0.5,side:THREE.FrontSide});
    const front=new THREE.Mesh(new THREE.PlaneGeometry(shW,shH),fMat); front.position.z=0.18; g.add(front);
    const back=new THREE.Mesh(new THREE.PlaneGeometry(shW,shH),bMat); back.position.z=-0.18; back.rotation.y=Math.PI; g.add(back);
    const tb=new THREE.Mesh(new THREE.BoxGeometry(shW*.88,.08,.36),edg); tb.position.set(0,shH/2-.04,0); g.add(tb);
    const tip=new THREE.Mesh(new THREE.ConeGeometry(shW*.14,.44,8),edg); tip.position.set(0,-shH/2-.21,0); g.add(tip);
    const dG=new THREE.SphereGeometry(.07,10,10);
    [-0.44,-0.22,0,0.22,0.44].forEach(x=>{const d=new THREE.Mesh(dG,edg);d.position.set(x,-shH*.34,.2);g.add(d);});
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.13,.17,.36,12),BLK),{position:new THREE.Vector3(0,-shH/2-.45,0)}));
    g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(.32,.36,.10,16),BLK),{position:new THREE.Vector3(0,-shH/2-.65,0)}));
    return g;
  }

  const BLABEL = { 1:'1ST PLACE', 2:'2ND PLACE', 3:'3RD PLACE' };
  const animObjs = [];
  let animRunning = false;

  canvases.forEach(canvas => {
    const row = JSON.parse(canvas.dataset.row);
    const n = parseInt(canvas.dataset.n);
    const W = canvas.width, H = canvas.height;
    const Z = 13;

    const sc = mkScene();
    const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
    renderer.setSize(W, H);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

    const cam = new THREE.PerspectiveCamera(40, W/H, 0.1, 100);
    cam.position.set(0, 0.4, Z);
    cam.lookAt(0, 0, 0);

    // Place each trophy centred in its cubby
    const fhw = Math.tan(20*Math.PI/180) * Z;
    const colW = W / n;

    row.forEach((item, ci) => {
      const pal = PAL[item.pos] || PAL[3];
      const mesh = item.type === 'season' ? mkCFP(pal) : mkShield(pal, BLABEL[item.pos]||'3RD PLACE');
      // Centre of cubby ci in pixel coords
      const px = colW * ci + colW / 2;
      const worldX = (px/W - 0.5) * 2 * fhw;
      mesh.position.set(worldX, 0, 0);
      sc.add(mesh);
      animObjs.push({ g: mesh, wx: worldX, spd: 0.48 + ci*0.04, off: ci*1.6, renderer, scene: sc, cam });
    });

    // Draw cubby dividers as vertical lines on top of canvas via overlay div
    // (handled by border-left in label divs below canvas)
  });

  if (!animRunning) {
    animRunning = true;
    let T = 0;
    function loop() {
      requestAnimationFrame(loop);
      T += 0.012;
      // Group by renderer to avoid redundant renders
      const rendered = new Set();
      animObjs.forEach(o => {
        o.g.rotation.y = T * o.spd + o.off;
        o.g.position.x = o.wx;
        o.g.position.y = Math.sin(T * 0.6 + o.off) * 0.06;
        o.g.position.z = 0;
        if (!rendered.has(o.renderer)) {
          o.renderer.render(o.scene, o.cam);
          rendered.add(o.renderer);
        }
      });
      // Re-render all (some may not be first-rendered above if objects share renderer)
      const allRenderers = new Map();
      animObjs.forEach(o => allRenderers.set(o.renderer, {sc:o.scene, cam:o.cam}));
      allRenderers.forEach((v,r) => r.render(v.sc, v.cam));
    }
    loop();
  }
}

/* ============================================================
   CHAT / MESSAGE BOARD VIEW
   ============================================================ */
let _chatTab = 'general';
let _chatMessages = { general: [], commissioner: [] };
let _chatPollTimer = null;
let _chatUnread = { general: 0, commissioner: 0 };

async function renderChat(content) {
  const isAdmin = State.player && State.player.isAdmin;
  const p = State.player;

  content.innerHTML = `
    <div style="display:flex; gap:0; border-bottom:1px solid var(--hairline); margin-bottom:0;">
      <button class="tab-btn ${_chatTab === 'general' ? 'active' : ''}" data-chat="general">💬 General</button>
      <button class="tab-btn ${_chatTab === 'commissioner' ? 'active' : ''}" data-chat="commissioner">📣 Commissioner</button>
    </div>
    <div id="chat-body" style="display:flex; flex-direction:column; height:calc(100vh - 220px);">
      <div id="chat-messages" style="flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px;">
        <div class="empty-state"><span class="spinner"></span></div>
      </div>
      ${_chatTab === 'commissioner' && !isAdmin ? '' : `
        <div style="padding:10px 14px; border-top:1px solid var(--hairline); background:var(--surface-1); display:flex; gap:8px; align-items:flex-end;">
          <textarea id="chat-input" placeholder="${_chatTab === 'commissioner' ? 'Commissioner message...' : 'Say something...'}"
            style="flex:1; background:var(--surface-2); border:1px solid var(--hairline); border-radius:var(--radius-sm); color:var(--text); padding:10px 12px; font-size:14px; resize:none; min-height:40px; max-height:100px; font-family:inherit; line-height:1.4;"
            rows="1"
          ></textarea>
          <button class="btn btn-primary" id="chat-send-btn" style="flex-shrink:0; padding:10px 16px;">Send</button>
        </div>
      `}
      ${_chatTab === 'commissioner' && !isAdmin ? '<div style="padding:10px 14px; text-align:center;" class="helptext">Commissioner messages only — read only for players</div>' : ''}
    </div>
  `;

  content.querySelectorAll('[data-chat]').forEach(btn => {
    btn.onclick = () => { _chatTab = btn.dataset.chat; renderChat(content); };
  });

  // auto-resize textarea
  const input = document.getElementById('chat-input');
  if (input) {
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 100) + 'px';
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(content); }
    });
  }

  const sendBtn = document.getElementById('chat-send-btn');
  if (sendBtn) sendBtn.onclick = () => sendChatMessage(content);

  // load messages
  await loadChatMessages(_chatTab);
  renderChatMessages();

  // poll every 30 seconds while on chat tab
  clearInterval(_chatPollTimer);
  _chatPollTimer = setInterval(async () => {
    if (State.view === 'chat') {
      await loadChatMessages(_chatTab);
      renderChatMessages();
    } else {
      clearInterval(_chatPollTimer);
    }
  }, 30000);
}

async function loadChatMessages(type) {
  try {
    const data = await api('getMessages', { type });
    _chatMessages[type] = data.messages || [];
  } catch(e) {
    console.log('Chat load error:', e.message);
  }
}

function renderChatMessages() {
  const container = document.getElementById('chat-messages');
  if (!container) return;
  const messages = _chatMessages[_chatTab] || [];
  const isAdmin = State.player && State.player.isAdmin;

  if (messages.length === 0) {
    container.innerHTML = '<div class="empty-state"><p class="helptext">No messages yet. ' + (_chatTab === 'general' ? 'Say hello!' : 'No commissioner messages yet.') + '</p></div>';
    return;
  }

  container.innerHTML = messages.map(m => {
    const isMe = m.playerId === State.player.id;
    const isComm = _chatTab === 'commissioner';
    const time = new Date(m.postedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const player = State.players.find(pl => pl.id === m.playerId);
    const avatarInnerChat = player && player.avatar
      ? `<img src="${player.avatar}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">`
      : `<div style="width:32px;height:32px;border-radius:50%;background:${isMe ? 'var(--upset-grad)' : 'var(--surface-2)'};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:${isMe ? '#1A1206' : 'var(--text)'};">${escapeHtml((m.teamName || '?')[0].toUpperCase())}</div>`;
    const avatar = player ? championRing(avatarInnerChat, player.id, 32) : avatarInnerChat;

    return `
      <div style="display:flex; gap:8px; align-items:flex-start; ${isMe ? 'flex-direction:row-reverse;' : ''}">
        ${avatar}
        <div style="max-width:75%; ${isMe ? 'align-items:flex-end;' : ''} display:flex; flex-direction:column; gap:3px;">
          <div style="font-size:11px; color:var(--text-faint); ${isMe ? 'text-align:right;' : ''}">
            ${isMe ? 'You' : `<span data-player-id="${m.playerId}" style="cursor:pointer;">${escapeHtml(m.teamName)}</span>`}${isComm ? ' <span style="color:var(--gold);font-weight:700;">Commissioner</span>' : ''} · ${time}
            ${isAdmin ? `<button class="btn btn-ghost btn-sm" style="font-size:10px;padding:1px 6px;margin-left:4px;" data-delete-msg="${m.messageId}">✕</button>` : ''}
          </div>
          <div style="background:${isMe ? 'var(--gold)' : 'var(--surface-2)'}; color:${isMe ? '#1A1206' : 'var(--text)'}; padding:9px 12px; border-radius:${isMe ? '16px 4px 16px 16px' : '4px 16px 16px 16px'}; font-size:14px; line-height:1.5; word-break:break-word;">
            ${escapeHtml(m.message)}
          </div>
        </div>
      </div>
    `;
  }).join('');

  // wire delete buttons for admins
  container.querySelectorAll('[data-delete-msg]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Delete this message?')) return;
      await api('deleteMessage', { adminId: State.player.id, messageId: btn.dataset.deleteMsg });
      await loadChatMessages(_chatTab);
      renderChatMessages();
    };
  });

  wirePlayerNameTaps(container);
  // scroll to bottom
  container.scrollTop = container.scrollHeight;
}

async function sendChatMessage(content) {
  const input = document.getElementById('chat-input');
  if (!input) return;
  const message = input.value.trim();
  if (!message) return;

  const sendBtn = document.getElementById('chat-send-btn');
  if (sendBtn) sendBtn.disabled = true;
  input.disabled = true;

  try {
    await api('postMessage', { playerId: State.player.id, type: _chatTab, message });
    input.value = '';
    input.style.height = 'auto';
    await loadChatMessages(_chatTab);
    renderChatMessages();
  } catch(e) {
    showToast(e.message || 'Could not send message', 'error');
  } finally {
    if (sendBtn) sendBtn.disabled = false;
    input.disabled = false;
    input.focus();
  }
}

function renderBowl(content) {
  const tabs = ['round1', 'quarter', 'semi', 'champion', 'standings'];
  content.innerHTML = `
    <div class="card" style="background:var(--upset-grad); color:#fff;">
      <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.85;">Season Finale</div>
      <div style="font-family:var(--font-display); font-size:22px; margin-top:2px;">Bowl Bonanza</div>
      <div class="helptext" style="color:rgba(255,255,255,0.85); margin-top:4px;">Separate contest, separate $${Number(State.season.bowlEntryFee || 25)} pot.</div>
    </div>
    <div class="tab-row" style="flex-wrap:wrap;">
      ${tabs.map(t => `<button data-bowltab="${t}" class="${State.bowlSubView === t ? 'active' : ''}" style="flex:1 1 30%;">${BOWL_PHASE_LABELS[t]}</button>`).join('')}
    </div>
    <div id="bowl-tab-content"></div>
  `;
  content.querySelectorAll('[data-bowltab]').forEach(btn => {
    btn.onclick = () => { State.bowlSubView = btn.dataset.bowltab; renderBowl(content); };
  });
  const tabContent = document.getElementById('bowl-tab-content');
  if (State.bowlSubView === 'standings') renderBowlStandingsTab(tabContent);
  else if (State.bowlSubView === 'champion') renderBowlChampionTab(tabContent);
  else renderBowlPhaseTab(tabContent, State.bowlSubView);
}

function renderBowlPhaseTab(el, phase) {
  const games = getBowlGamesForPhase(phase);
  const posted = isBowlPhasePosted(phase);
  const pointValue = BOWL_PHASE_POINTS[phase];
  const expectedUpsets = phase === 'round1' ? 2 : 0;

  if (games.length === 0) {
    el.innerHTML = `<div class="empty-state"><h3>${BOWL_PHASE_LABELS[phase]} not set up yet</h3><p>Check back once the commissioner posts these games.</p></div>`;
    return;
  }
  if (!posted) {
    el.innerHTML = `<div class="empty-state"><h3>${BOWL_PHASE_LABELS[phase]} not posted yet</h3><p>The commissioner is still setting lines for these games.</p></div>`;
    return;
  }

  const existingPicks = getMyBowlPicksForPhase(phase);
  if (existingPicks.length > 0 && Object.keys(_bowlDraftPicks).filter(gid => games.find(g => g.gameId === gid)).length === 0) {
    existingPicks.forEach(p => {
      const isUpset = p.isUpset === true || p.isUpset === 'TRUE';
      _bowlDraftPicks[p.gameId] = { pickedTeam: p.pickedTeam, isUpset };
      if (isUpset && !_bowlUpsetGameIds.includes(p.gameId)) _bowlUpsetGameIds.push(p.gameId);
    });
  }

  const pickedCount = games.filter(g => _bowlDraftPicks[g.gameId] && _bowlDraftPicks[g.gameId].pickedTeam).length;
  const upsetCount = games.filter(g => _bowlDraftPicks[g.gameId] && _bowlDraftPicks[g.gameId].isUpset).length;

  el.innerHTML = `
    <div class="card">
      <div class="flex-between">
        <span class="phase-badge">${BOWL_PHASE_LABELS[phase]} <span class="phase-pts">${pointValue} pt${pointValue > 1 ? 's' : ''}/game</span></span>
        <span class="helptext">${pickedCount}/${games.length} picked${expectedUpsets ? ` &middot; ${upsetCount}/${expectedUpsets} upsets` : ''}</span>
      </div>
    </div>
    <div id="bowl-games-list"></div>
    <button class="btn btn-gold btn-block" id="submit-bowl-picks-btn" style="margin-top:6px;">${existingPicks.length > 0 ? 'Update Picks' : 'Submit Picks'}</button>
  `;
  renderBowlGamesList(games, phase, expectedUpsets);
  document.getElementById('submit-bowl-picks-btn').onclick = () => submitBowlPicksForPhase(phase, games, expectedUpsets);
}

function renderBowlGamesList(games, phase, expectedUpsets) {
  const wrap = document.getElementById('bowl-games-list');
  wrap.innerHTML = games.map(g => {
    const draft = _bowlDraftPicks[g.gameId] || {};
    const favTeam = g.favorite;
    const dog = underdogOf(g);
    const result = computeGameResult(g);
    const locked = isGamePickLocked(g);
    const isUpsetActive = draft.isUpset;

    let resultStrip = '';
    if (result.isFinal) {
      resultStrip = `<div class="result-strip"><span class="mono" style="color:var(--text-soft);">${escapeHtml(g.awayTeam)} ${result.awayScore} – ${result.homeScore} ${escapeHtml(g.homeTeam)}</span>
        ${draft.pickedTeam ? `<span class="result-pill ${draft.isUpset ? (result.winner === dog ? 'upset-win' : 'loss') : (result.winner === draft.pickedTeam ? 'win' : 'loss')}">
          ${draft.isUpset ? (result.winner === dog ? 'Upset hit +' + fmtSpread(g.spread) : 'Upset miss') : (result.winner === draft.pickedTeam ? 'Correct' : 'Incorrect')}
        </span>` : ''}</div>`;
    }

    return `
      <div class="game-row ${isUpsetActive ? 'is-upset-selected' : ''}" data-gameid="${g.gameId}">
        <div class="flex-between" style="margin-bottom:6px;">${renderCountdownBadge(g)}</div>
        <div class="game-matchup">
          <div class="team-pick ${draft.pickedTeam === g.awayTeam ? 'selected' : ''}" data-gameid="${g.gameId}" data-team="${escapeHtml(g.awayTeam)}" style="${locked ? 'opacity:0.55; cursor:default;' : ''}">
            <div class="team-logo-row">
              ${renderTeamLogo(g.awayLogo, g.awayTeam)}
              <div><div class="tname">${escapeHtml(g.awayTeam)}</div>${favTeam === g.awayTeam ? '<div class="fav-badge">Favorite</div>' : ''}</div>
            </div>
            <div class="tline">${favTeam === g.awayTeam ? '-' + fmtSpread(g.spread) : '+' + fmtSpread(g.spread)}</div>
          </div>
          <div class="vs-divider">@</div>
          <div class="team-pick ${draft.pickedTeam === g.homeTeam ? 'selected' : ''}" data-gameid="${g.gameId}" data-team="${escapeHtml(g.homeTeam)}" style="${locked ? 'opacity:0.55; cursor:default;' : ''}">
            <div class="team-logo-row">
              ${renderTeamLogo(g.homeLogo, g.homeTeam)}
              <div><div class="tname">${escapeHtml(g.homeTeam)}</div>${favTeam === g.homeTeam ? '<div class="fav-badge">Favorite</div>' : ''}</div>
            </div>
            <div class="tline">${favTeam === g.homeTeam ? '-' + fmtSpread(g.spread) : '+' + fmtSpread(g.spread)}</div>
          </div>
        </div>
        ${expectedUpsets > 0 ? `
          <div class="upset-toggle ${isUpsetActive ? 'active' : ''}" data-gameid="${g.gameId}" data-dog="${escapeHtml(dog)}" style="${locked ? 'opacity:0.5;' : ''}">
            <div class="label"><span class="upset-checkbox">${isUpsetActive ? '✓' : ''}</span> Upset: ${escapeHtml(dog)}</div>
            <div class="points">+${fmtSpread(g.spread)} pts</div>
          </div>` : ''}
        ${resultStrip}
      </div>`;
  }).join('');

  wrap.querySelectorAll('.team-pick').forEach(el => {
    if (el.style.cursor === 'default') return;
    el.onclick = () => {
      const gameId = el.dataset.gameid;
      const team = el.dataset.team;
      const game = games.find(g => g.gameId === gameId);
      if (isGamePickLocked(game)) { showToast('This game has locked', 'error'); return; }
      if (!_bowlDraftPicks[gameId]) _bowlDraftPicks[gameId] = {};
      // if this game is currently flagged upset and the newly picked team is the favorite, drop the flag
      if (_bowlDraftPicks[gameId].isUpset && isFavorite(game, team)) {
        _bowlDraftPicks[gameId].isUpset = false;
        _bowlUpsetGameIds = _bowlUpsetGameIds.filter(id => id !== gameId);
      }
      _bowlDraftPicks[gameId].pickedTeam = team;
      renderBowlGamesList(games, phase, expectedUpsets);
    };
  });

  wrap.querySelectorAll('.upset-toggle').forEach(el => {
    if (el.style.cursor === 'default' && el.style.opacity === '0.5') { /* still allow click feedback */ }
    el.onclick = () => {
      const gameId = el.dataset.gameid;
      const dog = el.dataset.dog;
      const game = games.find(g => g.gameId === gameId);
      if (isGamePickLocked(game)) { showToast('This game has locked', 'error'); return; }
      const wasActive = _bowlDraftPicks[gameId] && _bowlDraftPicks[gameId].isUpset;
      if (wasActive) {
        _bowlDraftPicks[gameId].isUpset = false;
        _bowlUpsetGameIds = _bowlUpsetGameIds.filter(id => id !== gameId);
      } else {
        if (_bowlUpsetGameIds.length >= expectedUpsets) {
          showToast(`You can only select ${expectedUpsets} Upset Special picks`, 'error');
          return;
        }
        if (!_bowlDraftPicks[gameId]) _bowlDraftPicks[gameId] = {};
        _bowlDraftPicks[gameId].pickedTeam = dog;
        _bowlDraftPicks[gameId].isUpset = true;
        _bowlUpsetGameIds.push(gameId);
      }
      renderBowlGamesList(games, phase, expectedUpsets);
    };
  });
}

async function submitBowlPicksForPhase(phase, games, expectedUpsets) {
  const picks = games.map(g => {
    const d = _bowlDraftPicks[g.gameId];
    return (d && d.pickedTeam) ? { gameId: g.gameId, pickedTeam: d.pickedTeam, isUpset: !!d.isUpset } : null;
  }).filter(Boolean);

  if (picks.length !== games.length) { showToast(`Pick all ${games.length} games before submitting`, 'error'); return; }
  const upsetCount = picks.filter(p => p.isUpset).length;
  if (upsetCount !== expectedUpsets) { showToast(`This phase requires exactly ${expectedUpsets} Upset Special pick(s)`, 'error'); return; }

  const btn = document.getElementById('submit-bowl-picks-btn');
  btn.innerHTML = '<span class="spinner" style="border-top-color:#1A1206;"></span>';
  try {
    await api('submitBowlPicks', { phase, playerId: State.player.id, picks });
    showToast('Bowl picks locked in', 'success');
    await refreshState();
    renderContent();
  } catch (e) { btn.innerHTML = 'Submit Picks'; }
}

/* ---- Champion pick ---- */
function renderBowlChampionTab(el) {
  const semiGames = getBowlGamesForPhase('semi');
  if (semiGames.length === 0 || !isBowlPhasePosted('semi')) {
    el.innerHTML = `<div class="empty-state"><h3>Champion pick not open yet</h3><p>This unlocks once the Semifinal matchups are posted — pick your National Champion from the remaining 4 teams.</p></div>`;
    return;
  }
  const teams = [];
  semiGames.forEach(g => { teams.push(g.awayTeam); teams.push(g.homeTeam); });
  const myPick = getMyBowlChampionPick();

  el.innerHTML = `
    <div class="champion-card">
      <div class="phase-badge" style="margin-bottom:10px;">National Champion <span class="phase-pts">5 pts</span></div>
      <p class="helptext" style="margin-bottom:12px;">Pick the team you think wins it all.</p>
      ${teams.map(t => `<div class="champion-team-pick ${myPick && myPick.teamPicked === t ? 'selected' : ''}" data-team="${escapeHtml(t)}">${escapeHtml(t)}</div>`).join('')}
      <button class="btn btn-gold btn-block" id="submit-champion-btn" style="margin-top:10px;">${myPick ? 'Update Pick' : 'Submit Pick'}</button>
    </div>
  `;
  let selectedTeam = myPick ? myPick.teamPicked : null;
  el.querySelectorAll('.champion-team-pick').forEach(div => {
    div.onclick = () => {
      selectedTeam = div.dataset.team;
      el.querySelectorAll('.champion-team-pick').forEach(d => d.classList.toggle('selected', d.dataset.team === selectedTeam));
    };
  });
  document.getElementById('submit-champion-btn').onclick = async () => {
    if (!selectedTeam) { showToast('Select a team first', 'error'); return; }
    try {
      await api('submitBowlChampion', { playerId: State.player.id, teamPicked: selectedTeam });
      showToast('Champion pick saved', 'success');
      await refreshState();
      renderContent();
    } catch (e) {}
  };
}

/* ---- Bowl standings ---- */
function computeBowlStandingsLocally() {
  const players = State.players.filter(p => p.active);
  const finalGames = State.bowlGames.filter(isGameFinal);
  const champPicks = State.bowlChampion || [];
  const actualChampion = State.season.bowlChampionWinner || '';

  const standings = {};
  players.forEach(p => standings[p.id] = { playerId: p.id, name: p.name, teamName: p.teamName, points: 0, round1Correct: 0, upsetWins: 0, championCorrect: false });

  finalGames.forEach(g => {
    const result = computeGameResult(g);
    const dog = underdogOf(g);
    const spread = Number(g.spread) || 0;
    const pointValue = BOWL_PHASE_POINTS[g.phase] || 1;
    const gamePicks = State.bowlPicks.filter(p => p.gameId === g.gameId);
    gamePicks.forEach(p => {
      if (!standings[p.playerId]) return;
      const isUpset = p.isUpset === true || p.isUpset === 'TRUE';
      if (isUpset) {
        if (result.winner === dog) { standings[p.playerId].points += spread; standings[p.playerId].upsetWins += 1; }
      } else if (result.winner === p.pickedTeam) {
        standings[p.playerId].points += pointValue;
        if (g.phase === 'round1') standings[p.playerId].round1Correct += 1;
      }
    });
  });

  if (actualChampion) {
    champPicks.forEach(c => {
      if (!standings[c.playerId]) return;
      if (c.teamPicked === actualChampion) { standings[c.playerId].points += 5; standings[c.playerId].championCorrect = true; }
    });
  }

  return Object.values(standings).sort((a, b) => b.points - a.points || b.round1Correct - a.round1Correct);
}

function renderBowlStandingsTab(el) {
  const standings = computeBowlStandingsLocally();
  el.innerHTML = `
    <div class="card">
      <div class="card-title">Bowl Bonanza Standings</div>
      ${standings.length === 0 ? '<div class="empty-state"><p>No completed bowl games yet.</p></div>' : standings.map((s, i) => `
        <div class="standing-row ${i === 0 ? 'rank-1' : ''}">
          <div class="standing-rank">${i + 1}</div>
          <div style="flex:1;">
            <div class="standing-name">${escapeHtml(s.teamName || s.name)}${s.championCorrect ? ' 🏆' : ''}</div>
            <div class="standing-meta">${s.round1Correct}/41 first round &middot; ${s.upsetWins}/2 upsets hit</div>
          </div>
          <div class="standing-points ${i === 0 ? 'pulse-update' : ''}">${s.points % 1 === 0 ? s.points : s.points.toFixed(1)}</div>
        </div>
      `).join('')}
    </div>
    <p class="helptext" style="text-align:center;">Tiebreaker: most correct picks among the 41 first-round games.</p>
  `;
}

<script>
/* ============================================================
   ADMIN VIEW
   ============================================================ */
let _adminTab = 'week';
let _bowlAdminPhaseDraft = []; // for entering quarter/semi matchups manually
let _bowlRound1DateRange = { start: '', end: '' };

function renderAdmin(content) {
  const tabs = [
    { id: 'week', label: 'This Week' },
    { id: 'players', label: 'Players' },
    { id: 'ledger', label: 'Pot' },
    { id: 'season', label: 'Season' },

async function renderAdminNameClaims(el) {
  el.innerHTML = '<div class="empty-state"><span class="spinner"></span><p style="margin-top:12px;">Loading claims...</p></div>';
  try {
    const data = await api('adminGetNameClaims', { playerId: State.player.id });
    const claims = (data.claims || []).sort((a,b) => {
      if (a.status === 'pending' && b.status !== 'pending') return -1;
      if (b.status === 'pending' && a.status !== 'pending') return 1;
      return new Date(b.submittedAt) - new Date(a.submittedAt);
    });

    if (!claims.length) {
      el.innerHTML = '<div class="card"><p class="helptext">No name claims submitted yet.</p></div>';
      return;
    }

    el.innerHTML = `
      <div class="section-label">Name Claims (${claims.filter(c=>c.status==='pending').length} pending)</div>
      ${claims.map(c => {
        const isPending = c.status === 'pending';
        const badgeColor = c.status === 'approved' ? '#2a7a2a' : c.status === 'rejected' ? '#7a2a2a' : '#5a5a00';
        const badgeBg = c.status === 'approved' ? 'rgba(0,200,0,0.12)' : c.status === 'rejected' ? 'rgba(200,0,0,0.12)' : 'rgba(200,200,0,0.12)';
        return `<div class="card" style="margin-bottom:10px;${isPending?'border:1px solid var(--upset-gold);':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
            <div>
              <div style="font-size:14px;font-weight:700;color:var(--text);">${escapeHtml(c.playerName)} <span style="color:var(--text-soft);font-weight:400;">→</span> <span style="color:var(--upset-gold);">${escapeHtml(c.claimedTeamName)}</span></div>
              <div style="font-size:12px;color:var(--text-soft);margin-top:2px;">Current name: ${escapeHtml(c.currentTeamName)} · ${c.seasons} season${c.seasons!==1?'s':''} claimed (${(c.years||[]).join(', ')})</div>
              <div style="font-size:12px;color:var(--text-soft);margin-top:2px;">Submitted: ${new Date(c.submittedAt).toLocaleDateString()}</div>
            </div>
            <span style="font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:${badgeBg};color:${badgeColor};text-transform:uppercase;flex-shrink:0;">${c.status}</span>
          </div>
          ${c.reason ? `<div style="font-size:13px;color:var(--text);background:var(--surface-2);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:10px;font-style:italic;">"${escapeHtml(c.reason)}"</div>` : ''}
          ${isPending ? `
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary btn-sm claim-approve-btn" data-id="${escapeHtml(c.claimId)}" data-name="${escapeHtml(c.claimedTeamName)}" style="flex:1;">✓ Approve</button>
              <button class="btn btn-danger btn-sm claim-reject-btn" data-id="${escapeHtml(c.claimId)}" style="flex:1;">✗ Reject</button>
            </div>` : ''}
        </div>`;
      }).join('')}`;

    el.querySelectorAll('.claim-approve-btn').forEach(btn => {
      btn.onclick = async () => {
        const name = btn.dataset.name;
        if (!confirm(`Approve claim for "${name}"?\n\nThis will link all CareerHistory and UpsetHistory rows with this team name to the player's account. This cannot be undone.`)) return;
        btn.disabled = true; btn.textContent = 'Approving...';
        try {
          const res = await api('adminReviewNameClaim', { playerId: State.player.id, claimId: btn.dataset.id, decision: 'approved', reviewerName: State.player.teamName });
          if (res.ok) { showToast('Claim approved — history linked!', 'success'); renderAdminNameClaims(el); }
          else showToast(res.error || 'Error', 'error');
        } catch(e) { showToast('Network error', 'error'); }
      };
    });

    el.querySelectorAll('.claim-reject-btn').forEach(btn => {
      btn.onclick = async () => {
        if (!confirm('Reject this claim?')) return;
        btn.disabled = true; btn.textContent = 'Rejecting...';
        try {
          const res = await api('adminReviewNameClaim', { playerId: State.player.id, claimId: btn.dataset.id, decision: 'rejected', reviewerName: State.player.teamName });
          if (res.ok) { showToast('Claim rejected', 'success'); renderAdminNameClaims(el); }
          else showToast(res.error || 'Error', 'error');
        } catch(e) { showToast('Network error', 'error'); }
      };
    });

  } catch(e) {
    el.innerHTML = '<div class="card"><p class="helptext">Could not load name claims.</p></div>';
  }
}

/* ---- Admin: This Week ---- */

    ${posted ? `
      <div class="section-label">Results</div>

      </div>
      <div class="card" style="border:1px solid rgba(255,77,94,0.3);">
        <div class="card-title" style="color:var(--loss);">⚠️ Clear Week ${week} Data</div>
        <p class="helptext" style="line-height:1.6;">Wipes all games, picks, and snapshot rows for Week ${week}. Use after a test week to start fresh. <strong style="color:var(--text);">Cannot be undone.</strong></p>
        <button class="btn btn-danger btn-block" id="clear-week-btn" style="margin-top:10px;">Clear All Week ${week} Data</button>
      </div>
    ` : ''}
  `;

  document.getElementById('week-jump').onclick = () => {
    const w = prompt('Jump to week #:', week);
    if (w !== null && w !== '' && !isNaN(Number(w))) adminSetSeasonField('currentWeek', Number(w));
  };
  document.getElementById('assign-picker-btn').onclick = async () => {
    const playerId = document.getElementById('picker-select').value;
    if (!playerId) { showToast('Select a player first', 'error'); return; }
    await api('adminAssignPicker', { adminId: State.player.id, week, playerId });
    showToast('Picker assigned', 'success');
    await refreshState(); renderAdmin(document.getElementById('content'));
  };
  document.getElementById('random-picker-btn').onclick = async () => {
    const data = await api('adminRandomPicker', { adminId: State.player.id, week });
    showToast(`${data.playerName} randomly selected as picker`, 'success');
    await refreshState(); renderAdmin(document.getElementById('content'));
  };
  if (games.length > 0 && !posted) {
    document.getElementById('post-week-btn').onclick = async () => {
      try {
        await api('adminPostWeek', { adminId: State.player.id, week });
        showToast('Week posted! Players can pick now.', 'success');
        await refreshState(); renderAdmin(document.getElementById('content'));
      } catch (e) {}
    };
    const fetchBtn = document.getElementById('fetch-espn-lines-btn');
    if (fetchBtn) fetchBtn.onclick = async () => {
      fetchBtn.innerHTML = '<span class="spinner" style="border-top-color:#fff;"></span>';
      try {
        const data = await api('adminFetchEspnLines', { adminId: State.player.id, week });
        const matched = data.updated.filter(u => u.matched).length;
        showToast(`Matched ${matched}/${data.updated.length} games`, matched === data.updated.length ? 'success' : 'error');
        await refreshState(); renderAdmin(document.getElementById('content'));
      } catch (e) { fetchBtn.innerHTML = 'Fetch Lines from ESPN'; }
    };
    el.querySelectorAll('.manual-line-save').forEach(btn => {
      btn.onclick = async () => {
        const gameId = btn.dataset.gameid;
        const favSelect = el.querySelector(`select[data-gameid="${gameId}"]`);
        const spreadInput = el.querySelector(`input[data-spread="${gameId}"]`);
        const kickoffInput = el.querySelector(`input[data-kickoff="${gameId}"]`);
        await api('adminOverrideLine', { adminId: State.player.id, gameId, favorite: favSelect.value, spread: spreadInput.value, kickoff: kickoffInput.value ? new Date(kickoffInput.value).toISOString() : '' });
        showToast('Line updated', 'success');
        await refreshState(); renderAdmin(document.getElementById('content'));
      };
    });
  }
  if (posted) {
    document.getElementById('fetch-results-btn').onclick = async () => {
      const btn = document.getElementById('fetch-results-btn');
      btn.innerHTML = '<span class="spinner" style="border-top-color:#fff;"></span>';
      try {
        const data = await api('adminFetchResults', { adminId: State.player.id, week });
        const finals = data.updates.filter(u => u.final).length;
        showToast(`${finals}/${data.updates.length} games marked final`, 'success');
        await refreshState(); renderAdmin(document.getElementById('content'));
      } catch (e) { btn.innerHTML = 'Fetch Final Scores (ESPN)'; }
    };
    document.getElementById('refresh-snapshot-btn').onclick = async () => {
      const btn = document.getElementById('refresh-snapshot-btn');
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        const data = await api('adminRefreshSnapshot', { adminId: State.player.id, week });
        showToast(`Snapshot updated — ${data.added} new games added, ${data.existing} already on file`, 'success');
        btn.innerHTML = 'Add Missing Lines to Snapshot';
      } catch(e) { btn.innerHTML = 'Add Missing Lines to Snapshot'; }
    };
    document.getElementById('clear-week-btn').onclick = async () => {
      if (!confirm(`⚠️ This will permanently delete all games, picks, and snapshot data for Week ${week}. Are you sure?`)) return;
      const btn = document.getElementById('clear-week-btn');
      btn.innerHTML = '<span class="spinner"></span>';
      try {
        await api('adminClearWeek', { adminId: State.player.id, week });
        showToast(`Week ${week} data cleared`, 'success');
        await refreshState();
        renderAdmin(document.getElementById('content'));
      } catch(e) { btn.innerHTML = `Clear All Week ${week} Data`; }
    };
    document.getElementById('apply-defaults-btn').onclick = async () => {
      try {
        const data = await api('adminApplyNoPickDefaults', { adminId: State.player.id, week });
        showToast(`${data.defaultsApplied} default picks applied`, 'success');
        await refreshState(); renderAdmin(document.getElementById('content'));
      } catch (e) {}
    };
    el.querySelectorAll('.manual-result-save').forEach(btn => {
      btn.onclick = async () => {
        const gameId = btn.dataset.gameid;
        const homeInput = el.querySelector(`input[data-result-home="${gameId}"]`);
        const awayInput = el.querySelector(`input[data-result-away="${gameId}"]`);
        await api('adminOverrideResult', { adminId: State.player.id, gameId, homeScore: homeInput.value, awayScore: awayInput.value });
        showToast('Result saved', 'success');
        await refreshState(); renderAdmin(document.getElementById('content'));
      };
    });
  }
}

function renderAdminGamesCard(games, posted) {
  return `
    <div class="section-label">Games &amp; Lines</div>
    ${!posted ? `
      <div class="card" style="background:var(--surface-2); margin-bottom:10px;">
        <p class="helptext"><strong style="color:var(--text);">If the picker used the ESPN board</strong>, lines and kickoff times are already filled in — just review below and click Post. If a game is missing a line (picked manually or ESPN didn't have it), use the override fields and the fetch button.</p>
        <button class="btn btn-ghost btn-block" id="fetch-espn-lines-btn" style="margin-top:10px;">Re-fetch Lines from ESPN</button>
      </div>` : ''}
    ${games.map(g => {
      const result = computeGameResult(g);
      const kickoffLocal = g.kickoff ? toLocalDatetimeInputValue(g.kickoff) : '';
      return `
      <div class="card" style="padding:12px 14px;">
        <div class="flex-between" style="margin-bottom:8px;">
          <strong style="font-size:14px;">${escapeHtml(g.awayTeam)} @ ${escapeHtml(g.homeTeam)}</strong>
          <span class="line-badge">${g.source === 'espn' ? 'ESPN' : (g.source === 'manual' ? 'Manual' : 'No line')}</span>
        </div>
        ${!posted ? `
          <div class="row2">
            <select data-gameid="${g.gameId}" style="padding:8px; border-radius:7px; border:1.5px solid var(--hairline);">
              <option value="">Favorite...</option>
              <option value="${escapeHtml(g.awayTeam)}" ${g.favorite === g.awayTeam ? 'selected' : ''}>${escapeHtml(g.awayTeam)}</option>
              <option value="${escapeHtml(g.homeTeam)}" ${g.favorite === g.homeTeam ? 'selected' : ''}>${escapeHtml(g.homeTeam)}</option>
            </select>
            <input type="number" step="0.5" data-spread="${g.gameId}" value="${g.spread || ''}" placeholder="Spread" class="editable-line-input" style="width:100%;">
          </div>
          <div class="field" style="margin-top:8px; margin-bottom:0;">
            <label>Kickoff</label>
            <input type="datetime-local" data-kickoff="${g.gameId}" value="${kickoffLocal}">
          </div>
          <button class="btn btn-ghost btn-sm manual-line-save" data-gameid="${g.gameId}" style="margin-top:8px;">Save Line &amp; Kickoff</button>
        ` : `
          <p class="helptext">${g.favorite ? escapeHtml(g.favorite) + ' favored by ' + fmtSpread(g.spread) : 'No line set'} ${g.kickoff ? '&middot; ' + new Date(g.kickoff).toLocaleString() : ''}</p>
        `}
        ${posted ? `
          <div class="divider" style="margin:10px 0;"></div>
          <div class="row2">
            <div style="display:flex; gap:6px; align-items:center;"><span class="helptext" style="white-space:nowrap;">${escapeHtml(g.awayTeam)}</span><input type="number" data-result-away="${g.gameId}" value="${result.isFinal ? result.awayScore : ''}" class="editable-line-input"></div>
            <div style="display:flex; gap:6px; align-items:center;"><span class="helptext" style="white-space:nowrap;">${escapeHtml(g.homeTeam)}</span><input type="number" data-result-home="${g.gameId}" value="${result.isFinal ? result.homeScore : ''}" class="editable-line-input"></div>
          </div>
          <button class="btn btn-ghost btn-sm manual-result-save" data-gameid="${g.gameId}" style="margin-top:8px;">Save Final Score</button>
          ${result.isFinal ? '<span class="pill pill-posted" style="margin-left:8px;">Final</span>' : ''}
        ` : ''}
      </div>
    `}).join('')}
  `;
}

function toLocalDatetimeInputValue(isoString) {
  const d = new Date(isoString);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function adminSetSeasonField(key, value) {
  await api('adminSetSeason', { adminId: State.player.id, [key]: value });

    <div class="section-label">Active Roster (${active.length})</div>

        : '<span style="color:var(--text-faint);">No payment info</span>';
      return `

          ${p.avatar ? `<img src="${p.avatar}" style="width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0;">` : `<div style="width:36px; height:36px; border-radius:50%; background:var(--upset-grad); display:flex; align-items:center; justify-content:center; font-weight:700; color:#1A1206; flex-shrink:0;">${escapeHtml((p.teamName || p.name || '?')[0])}</div>`}

            <div class="helptext">${escapeHtml(p.name)} &middot; ${p.careerPoints || 0} career pts</div>
            <div class="helptext" style="margin-top:2px;">${paymentInfo}</div>
          </div>
          <button class="btn ${p.isPaid ? 'btn-ghost' : 'btn-gold'} btn-sm" data-toggle-paid="${p.id}" data-is-paid="${p.isPaid}">${p.isPaid ? '✓ Paid' : 'Mark Paid'}</button>

        </div>
      `;
    }).join('')}
  `;

  // pending approve/reject
  el.querySelectorAll('[data-approve]').forEach(btn => {
    btn.onclick = async () => {
      await api('adminApprovePlayer', { adminId: State.player.id, id: btn.dataset.approve, approve: true });
      showToast('Player approved and activated', 'success');
      await refreshState(); renderAdmin(document.getElementById('content'));
    };
  });
  el.querySelectorAll('[data-reject]').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Remove this registration entirely?')) return;
      await api('adminApprovePlayer', { adminId: State.player.id, id: btn.dataset.reject, approve: false });
      showToast('Registration removed', 'success');
      await refreshState(); renderAdmin(document.getElementById('content'));

  document.getElementById('add-player-btn').onclick = async () => {

}

              <div style="font-weight:700; font-size:13px;">${escapeHtml(p.teamName || p.name)}</div>

      <div class="field"><label>Player</label><select id="ledger-player" style="color:#1a1a1a;">${State.players.filter(p => p.active).map(p => `<option value="${p.id}">${escapeHtml(p.teamName || p.name)}</option>`).join('')}</select></div>
