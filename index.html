<style>
/* ============================================================
   UPSET SPECIAL LEAGUE — "Night Board"
   A live odds board after dark. Chalk (favorite) is calm and gray;
   the Upset Special burns gold-to-ember. Numbers glow when they move.
   ============================================================ */
:root{
  --void:        #161B27;
  --surface:     #1E2433;
  --surface-2:   #262E40;
  --surface-3:   #2F384C;
  --hairline:    #3A4459;
  --hairline-soft: #1A2030;

  --text:        #E8EAED;
  --text-soft:   #8C97AC;
  --text-faint:  #6E7892;

  --win:         #1ED66B;
  --win-soft:    rgba(30,214,107,0.12);
  --loss:        #FF4D5E;
  --loss-soft:   rgba(255,77,94,0.12);

  --gold:        #F2B632;
  --ember:       #FF6B35;
  --upset-grad:  linear-gradient(135deg, #F2B632 0%, #FF8A3D 55%, #FF4D5E 100%);
  --upset-grad-soft: linear-gradient(135deg, rgba(242,182,50,0.14), rgba(255,77,94,0.10));

  --navy-accent: #4D7CFF;

  --shadow-sm:   0 1px 2px rgba(0,0,0,0.4);
  --shadow-md:   0 6px 20px rgba(0,0,0,0.45);
  --shadow-lg:   0 16px 50px rgba(0,0,0,0.55);
  --glow-gold:   0 0 0 1px rgba(242,182,50,0.4), 0 0 24px rgba(242,182,50,0.18);
  --glow-win:    0 0 0 1px rgba(30,214,107,0.35), 0 0 18px rgba(30,214,107,0.15);

  --radius:      16px;
  --radius-sm:   10px;
  --radius-lg:   22px;

  --font-display: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body:    'Inter', -apple-system, 'Segoe UI', sans-serif;
  --font-mono:    'IBM Plex Mono', 'SF Mono', Consolas, monospace;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: var(--font-body);
  background: var(--void);
  background-image:
    radial-gradient(ellipse 900px 500px at 50% -10%, rgba(77,124,255,0.12), transparent 60%),
    radial-gradient(ellipse 700px 400px at 90% 10%, rgba(242,182,50,0.08), transparent 60%);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
  letter-spacing: 0.005em;
}

h1,h2,h3,h4{ font-family: var(--font-display); font-weight:700; margin:0; letter-spacing:0.01em; color: var(--text); }
.mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing:0.02em; }

button{ font-family: var(--font-body); cursor:pointer; border:none; color: var(--text); }
input, select{ font-family: var(--font-body); color: var(--text); }
::selection{ background: rgba(242,182,50,0.3); }

/* visible keyboard focus everywhere */
button:focus-visible, input:focus-visible, select:focus-visible, .team-pick:focus-visible, .game-row:focus-visible{
  outline: 2px solid var(--gold); outline-offset: 2px;
}

/* ---------- App shell ---------- */
#app{ max-width: 560px; margin: 0 auto; min-height:100vh; background: transparent; position:relative; padding-bottom: 94px; }
@media (min-width: 700px){ #app{ max-width: 760px; } }

.topbar{
  background: rgba(16,21,31,0.72);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-bottom: 1px solid var(--hairline);
  color: var(--text);
  padding: 18px 20px 16px;
  position: sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
}
.topbar .brand{ display:flex; flex-direction:column; gap:2px; }
.topbar-emblem{ display:inline-flex; vertical-align:middle; margin-right:8px; width:32px; height:32px; flex-shrink:0; }
.topbar-emblem img{ width:32px; height:32px; border-radius:6px; display:block; }
.topbar .brand-name{
  font-family: var(--font-display);
  font-size: 19px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--text);
}
.topbar .brand-name .accent{
  background: var(--upset-grad);
  -webkit-background-clip: text; background-clip:text; color:transparent;
}
.topbar .brand-sub{ font-size:11px; color: var(--text-faint); letter-spacing:0.06em; text-transform:uppercase; margin-top:1px; }
.topbar .who{ text-align:right; font-size:12px; color: var(--text-soft); }
.topbar .who .name{ color: var(--text); font-weight:600; }
.topbar .logout{ background:none; color: var(--text-faint); font-size:11px; text-decoration:underline; padding:3px 0 0; transition: color 0.15s var(--ease); }
.topbar .logout:hover{ color: var(--text-soft); }

.content{ padding: 18px 16px 8px; animation: rise 0.4s var(--ease) both; }
@keyframes rise{ from{ opacity:0; transform: translateY(8px); } to{ opacity:1; transform: translateY(0); } }

/* ---------- Bottom nav ---------- */
.bottomnav{
  position: fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:560px;
  background: rgba(16,21,31,0.85);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border-top:1px solid var(--hairline);
  display:flex; z-index:50;
}
@media (min-width:700px){ .bottomnav{ max-width:760px; } }
.bottomnav button{
  flex:1; background:none; padding:10px 4px 12px; display:flex; flex-direction:column; align-items:center; gap:4px;
  color: var(--text-faint); font-size:11px; font-weight:600; letter-spacing:0.02em;
  transition: color 0.18s var(--ease), transform 0.12s var(--ease);
}
.bottomnav button:active{ transform: scale(0.92); }
.bottomnav button.active{ color: var(--text); }
.bottomnav button .dot{ width:4px;height:4px;border-radius:50%; background:transparent; transition: background 0.2s var(--ease), box-shadow 0.2s var(--ease); }
.bottomnav button.active .dot{ background: var(--gold); box-shadow: 0 0 8px rgba(242,182,50,0.8); }
.bottomnav button svg{ width:20px; height:20px; transition: transform 0.18s var(--ease); }
.bottomnav button.active svg{ transform: translateY(-1px); }

/* ---------- Cards ---------- */
.card{
  background: var(--surface);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 16px;
  margin-bottom: 14px;
  transition: border-color 0.2s var(--ease), transform 0.15s var(--ease), box-shadow 0.2s var(--ease);
}
.card-title{ font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-soft); font-weight:700; margin-bottom:10px; }

.section-label{
  font-family: var(--font-display);
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--text-soft); font-weight:700; margin: 22px 0 10px; display:flex; align-items:center; gap:8px;
}
.section-label::after{ content:''; flex:1; height:1px; background:var(--hairline); }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding: 13px 18px; border-radius: 11px; font-weight:700; font-size:13px;
  font-family: var(--font-display); letter-spacing:0.03em; text-transform:uppercase;
  transition: transform 0.1s var(--ease), opacity 0.15s var(--ease), box-shadow 0.2s var(--ease), filter 0.15s var(--ease);
}
.btn:active{ transform: scale(0.96); }
.btn-primary{ background: var(--surface-3); color: var(--text); border:1px solid var(--hairline); }
.btn-primary:hover{ border-color: var(--navy-accent); }
.btn-primary:disabled{ opacity:0.35; }
.btn-gold{ background: var(--upset-grad); color:#1A1206; box-shadow: 0 4px 18px rgba(242,182,50,0.25); }
.btn-gold:hover{ filter: brightness(1.08); box-shadow: 0 6px 24px rgba(242,182,50,0.35); }
.btn-ghost{ background:transparent; color: var(--text); border:1px solid var(--hairline); }
.btn-ghost:hover{ border-color: var(--text-faint); background: var(--surface-2); }
.btn-danger{ background: var(--loss-soft); color: var(--loss); border:1px solid rgba(255,77,94,0.25); }
.btn-block{ width:100%; }
.btn-sm{ padding:9px 12px; font-size:11px; border-radius:9px; }

/* ---------- Forms ---------- */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:11px; font-weight:600; color:var(--text-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em; }
.field input, .field select{
  width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--hairline);
  font-size:15px; background: var(--surface-2); color: var(--text);
  transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
}
.field input:focus, .field select:focus{ outline:none; border-color: var(--navy-accent); background: var(--surface-3); }
.field input::placeholder{ color: var(--text-faint); }
[id^="bio-"]:is(input,textarea){ color:#000; background:#fff; border:1px solid var(--hairline); border-radius:var(--radius-sm); padding:10px 12px; font-size:14px; font-family:inherit; width:100%; box-sizing:border-box; margin-top:4px; }
input[id^="bio-"], textarea[id^="bio-"]{ color:#000; background:#fff; }
.row2{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }

/* ---------- Game row ---------- */
.game-row{
  background: var(--surface); border:1px solid var(--hairline); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px; position:relative; overflow:hidden;
  transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
}
.game-row.is-upset-selected{ border-color: rgba(242,182,50,0.5); box-shadow: var(--glow-gold); }
.game-matchup{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.team-pick{
  flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:11px 12px; border-radius:10px; border:1px solid var(--hairline); background: var(--surface-2);
  cursor:pointer; transition: background 0.15s var(--ease), border-color 0.15s var(--ease), transform 0.1s var(--ease);
}
.team-pick:hover{ border-color: var(--text-faint); }
.team-pick:active{ transform: scale(0.98); }
.team-pick.selected{ background: var(--surface-3); border-color: var(--navy-accent); box-shadow: 0 0 0 1px rgba(77,124,255,0.3); }
.team-pick .tname{ font-weight:700; font-size:14px; color: var(--text); }

.team-logo-row{ display:flex; align-items:center; gap:9px; }
.team-logo{
  width:24px; height:24px; border-radius:50%; flex-shrink:0; object-fit:contain;
  background: var(--surface-3); padding:2px; border:1px solid var(--hairline);
}
.team-logo-fallback{

<script>

async function api(action, payload) {

async function checkAppVersion() {
  try {
    // fetch this page's own source from the server -- if the BUILD_TIME in the

    // uses cache:reload to always get the server's current version, not a cached copy.
    const resp = await fetch(window.location.href, { cache: 'reload' });
    const html = await resp.text();
    const match = html.match(/BUILD_TIME = '([^']+)'/);
    if (match && match[1] && match[1] !== BUILD_TIME) {
      showVersionBanner(match[1]);
    }
  } catch(e) { /* version check failure is non-fatal */ }

  const banner = document.createElement('div');

  banner.className = 'version-banner';

  document.body.prepend(banner);

  State.bowlGames = data.bowlGames;
  State.bowlPicks = data.bowlPicks;
  State.bowlChampion = data.bowlChampion;
  State.bowlLedger = data.bowlLedger;
  State.snapshotCount = data.snapshotCount || 0;
  // pre-load career history in the background so champion rings work everywhere
  if (!State._careerHistory) {
    api('getCareerHistory', {}).then(d => { State._careerHistory = d.history || []; }).catch(()=>{});
  }
  // refresh logged-in player's own record (team name may have changed elsewhere)
  const me = State.players.find(p => p.id === State.player.id);
  if (me) {
    State.player = { ...State.player, teamName: me.teamName, name: me.name, isAdmin: me.isAdmin, active: me.active, isPaid: me.isPaid, venmo: me.venmo, paypal: me.paypal, avatar: me.avatar, paymentPref: me.paymentPref, fcmToken: me.fcmToken, scoreNotif: me.scoreNotif, chatNotif: me.chatNotif };
    saveSession(State.player);
  }
}

// runs a background refresh without blocking the UI -- only re-renders if something actually changed
async function silentRefresh() {
  try {
    const before = JSON.stringify({ games: State.games, picks: State.picks, rotation: State.rotation, season: State.season });
    await refreshState();
    const after = JSON.stringify({ games: State.games, picks: State.picks, rotation: State.rotation, season: State.season });
    if (before !== after) {
      const content = document.getElementById('content');
      if (!content) return;
      switch (State.view) {
        case 'home': renderHome(content); break;
        case 'slate': renderSlate(content); break;
        case 'standings': renderStandings(content); break;
        case 'scores': renderLiveScores(content); break;
        case 'bowl': renderBowl(content); break;
        case 'admin': renderAdmin(content); break;
        case 'rules': renderRules(content); break;
      }
    }
  } catch(e) { /* silent -- cached state stays on screen */ }
}

// auto-refresh every 45 seconds to keep scores/countdowns current
function startBackgroundPolling() {
  if (window._pollTimer) clearInterval(window._pollTimer);
  window._pollTimer = setInterval(() => {
    if (State.player && document.getElementById('content')) silentRefresh();
  }, 45000);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Returns championship years for a player (highest points each year in CareerHistory)
function getChampionYearsForPlayer(playerId) {
  if (!playerId || !State._careerHistory) return [];
  const byYear = {};
  State._careerHistory.forEach(r => {
    if (!byYear[r.year]) byYear[r.year] = [];
    byYear[r.year].push(r);
  });
  const champYears = [];
  Object.entries(byYear).forEach(([year, rows]) => {
    const sorted = rows.slice().sort((a,b) => Number(b.points) - Number(a.points));
    if (sorted.length && String(sorted[0].playerId) === String(playerId)) champYears.push(Number(year));
  });
  return champYears.sort((a,b) => a - b);
}

// Wraps an avatar with a spinning gold ring + "YYYY, YYYY Champion(s)" label
function championRing(avatarHtml, playerId, size) {
  const years = getChampionYearsForPlayer(playerId);
  const inner = `<div style="width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${avatarHtml}</div>`;
  if (!years.length) return inner;
  const label = years.join(', ') + (years.length === 1 ? ' Champion' : ' Champions');
  const pad = Math.max(3, Math.round(size * 0.09));
  const fs = Math.max(7, Math.round(size * 0.14));
  return `<div style="position:relative;display:inline-flex;flex-direction:column;align-items:center;flex-shrink:0;" title="${escapeHtml(label)}">` +
    `<div style="position:relative;width:${size}px;height:${size}px;">` +
      `<div style="position:absolute;inset:-${pad}px;border-radius:50%;background:conic-gradient(#FFD700 0deg,#FFF5A0 45deg,#C8960C 90deg,#FFD700 135deg,#FFF5A0 180deg,#C8960C 225deg,#FFD700 270deg,#FFF5A0 315deg,#C8960C 360deg);box-shadow:0 0 ${pad*3}px rgba(212,160,0,0.8);animation:champSpin 6s linear infinite;"></div>` +
      `<div style="position:absolute;inset:${Math.round(pad*0.3)}px;border-radius:50%;background:var(--surface-1);z-index:1;"></div>` +
      `<div style="position:absolute;inset:${pad}px;border-radius:50%;overflow:hidden;z-index:2;display:flex;align-items:center;justify-content:center;">${avatarHtml}</div>` +
    `</div>` +
    `<div style="margin-top:2px;background:linear-gradient(135deg,#9A6A00,#FFD700,#9A6A00);color:#1A0800;font-size:${fs}px;font-weight:800;padding:1px ${Math.round(fs*0.6)}px;border-radius:20px;white-space:nowrap;letter-spacing:0.02em;box-shadow:0 1px 4px rgba(0,0,0,0.5);">${escapeHtml(label)}</div>` +
  `</div>`;
}

/* ============================================================
   UTILITY / HELPER FUNCTIONS
   ============================================================ */
function currentWeek() { const cw = (State.season || {}).currentWeek; return cw !== undefined && cw !== '' ? Number(cw) : 1; }
function fmtSpread(s) { const n = Number(s); return n % 1 === 0 ? n.toFixed(1) : String(n); }
function getPlayerById(id) { return (State.players || []).find(p => p.id === id); }
function getRotationForWeek(week) { return (State.rotation || []).find(r => Number(r.week) === Number(week)); }
function isWeekPosted(week) { const r = getRotationForWeek(week); return r && r.status === 'posted'; }
function isGameFinal(game) { return game.isFinal === true || game.isFinal === 'TRUE'; }

function getGamesForWeek(week) {
  const all = (State.games || []).filter(g => Number(g.week) === Number(week));
  const boardGames = all.filter(g => g.source !== 'external');
  if (boardGames.length <= 10) return boardGames;
  return boardGames.slice().sort((a, b) => new Date(a.postedAt||0) - new Date(b.postedAt||0)).slice(0, 10);
}

function getMyPicksForWeek(week) {
  return (State.picks || []).filter(p => p.playerId === State.player.id && Number(p.week) === Number(week));
}

function computeGameResult(game) {
  if (!game || !isGameFinal(game)) {
    return { isFinal: false, winner: null, underdog: null, upsetOccurred: false, awayScore: '', homeScore: '' };
  }
  const home = Number(game.finalHomeScore), away = Number(game.finalAwayScore);
  const winner = home > away ? game.homeTeam : away > home ? game.awayTeam : 'TIE';
  const underdog = game.favorite === game.homeTeam ? game.awayTeam : game.homeTeam;
  const upsetOccurred = winner === underdog;
  return { isFinal: true, winner, underdog, upsetOccurred, awayScore: away, homeScore: home };
}

function isFavorite(game, team) { return game.favorite === team; }

function isGamePickLocked(game) {
  if (!game) return false;
  if (isGameFinal(game)) return true;
  if (!game.kickoff) return false;
  return new Date() >= new Date(new Date(game.kickoff).getTime() - 5 * 60 * 1000);
}

function isGameStarted(game) {
  if (!game || !game.kickoff) return false;
  return new Date() >= new Date(game.kickoff);
}

// Upset Special locks 5 minutes before the EARLIEST kickoff of the week.
// Once the first game of the week kicks off, everyone can see all upset picks.
function isUpsetSpecialLocked(games) {
  if (!games || games.length === 0) return false;
  const kickoffs = games
    .filter(g => g.kickoff)
    .map(g => new Date(g.kickoff).getTime());
  if (kickoffs.length === 0) return false;
  const earliest = Math.min(...kickoffs);
  return Date.now() >= earliest - 5 * 60 * 1000;
}

// Returns true if the earliest game of the week has kicked off (picks visible for upset)
function isUpsetPicksRevealed(games) {
  if (!games || games.length === 0) return false;
  return games.some(g => isGameStarted(g));
}

function renderCountdownBadge(game) {
  if (isGameFinal(game)) return '<span class="pill pill-final">Final</span>';
  if (!game.kickoff) return '';
  const now = new Date();
  const ko = new Date(game.kickoff);
  const diff = ko - now;
  if (diff <= 0) return '<span class="pill pill-live">Live</span>';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  if (h > 24) return `<span class="helptext">${ko.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})}</span>`;
  if (h > 0) return `<span class="helptext">Kicks off in ${h}h ${m}m</span>`;
  return `<span class="helptext" style="color:var(--loss);">Kicks off in ${m}m</span>`;
}

function renderSlate(content) {
  const week = currentWeek();
  const rotation = getRotationForWeek(week);
  const games = getGamesForWeek(week);
  const posted = isWeekPosted(week);
  const isPicker = rotation && rotation.playerId === State.player.id;

  if (!rotation) {
    content.innerHTML = `<div class="empty-state"><h3>No picker assigned</h3><p>The commissioner hasn't assigned this week's picker yet.</p></div>`;
    return;
  }
  if (!posted && isPicker && rotation.status !== 'submitted') {
    renderPickerSubmissionForm(content, week);
    return;
  }
  if (!posted) {
    const picker = getPlayerById(rotation.playerId);
    const pickerName = picker ? (picker.teamName || picker.name) : 'This week\'s picker';
    content.innerHTML = `
      <div class="empty-state">
        <h3>Board not posted yet</h3>
        <p>${escapeHtml(pickerName)} has ${rotation.status === 'submitted' ? 'submitted their 10 games — waiting on the commissioner to set lines and post the board.' : 'not yet submitted their 10 games.'}</p>
      </div>`;
    return;
  }
  renderPicksBoard(content, week, games);
}

        </div>
      </div>
      <p class="helptext">Defaults to this weekend's games. Use the date range to load a different week.</p>
    </div>
    <div id="picker-games-list"><div class="empty-state"><p>Loading this weekend's games from ESPN...</p></div></div>
    <button class="btn btn-gold btn-block" id="submit-slate-btn" style="margin-top:6px;" disabled>Select 10 Games to Submit</button>
  `;

  // set default dates to this weekend
  const today = new Date();
  const dayOfWeek = today.getDay();
  const daysUntilFri = dayOfWeek <= 5 ? (5 - dayOfWeek) : 6;
  const fri = new Date(today.getTime() + daysUntilFri * 24 * 60 * 60 * 1000);
  const sun = new Date(fri.getTime() + 2 * 24 * 60 * 60 * 1000);
  const fmt = d => d.toISOString().split('T')[0];
  document.getElementById('picker-start-date').value = fmt(fri);
  document.getElementById('picker-end-date').value = fmt(sun);

  document.getElementById('picker-load-btn').onclick = () => loadPickerSlate(content, week);
  document.getElementById('submit-slate-btn').onclick = submitSlate;

  // auto-load immediately
  loadPickerSlate(content, week);
}

async function loadPickerSlate(content, week) {
  const startInput = document.getElementById('picker-start-date');
  const endInput = document.getElementById('picker-end-date');
  const startDate = startInput ? startInput.value.replace(/-/g, '') : '';
  const endDate = endInput ? endInput.value.replace(/-/g, '') : '';

  const listEl = document.getElementById('picker-games-list');
  listEl.innerHTML = `<div class="empty-state"><span class="spinner" style="border-top-color:var(--gold); border-color:rgba(255,255,255,0.08);"></span><p style="margin-top:12px;">Loading games...</p></div>`;

  try {
    // try snapshot first -- if there are games in LineSnapshot for this week, show those
    // (covers test data AND the real season after Sunday's auto-snapshot runs)
    const snapData = await api('getPickerSlateFromSnapshot', { week });
    if (snapData.games && snapData.games.length > 0) {
      _pickerAllGames = snapData.games;
      renderPickerGamesList(week);
      return;
    }
    // no snapshot yet -- fall back to live ESPN
    listEl.innerHTML = `<div class="empty-state"><span class="spinner" style="border-top-color:var(--gold); border-color:rgba(255,255,255,0.08);"></span><p style="margin-top:12px;">Loading from ESPN...</p></div>`;
    const data = await api('getWeeklyEspnSlate', { startDate, endDate });
    _pickerAllGames = data.games;
    renderPickerGamesList(week);
  } catch(e) {
    listEl.innerHTML = `<div class="empty-state"><h3>Couldn't load games</h3><p>Check your connection and try again, or adjust the date range.</p></div>`;
  }
}

function renderPickerGamesList(week) {
  const listEl = document.getElementById('picker-games-list');
  if (!listEl) return;

  if (_pickerAllGames.length === 0) {
    listEl.innerHTML = `<div class="empty-state"><h3>No games found</h3><p>Try a different date range — ESPN may not have next week's schedule posted yet.</p></div>`;
    return;
  }

  // group by kickoff time bucket (morning, afternoon, evening, night)
  const groups = {};
  _pickerAllGames.forEach(g => {
    const bucket = kickoffBucket(g.kickoff);
    if (!groups[bucket]) groups[bucket] = [];
    groups[bucket].push(g);
  });

  const selectedIds = new Set(_pickerSelectedGames.map(g => g.espnEventId));

  listEl.innerHTML = Object.entries(groups).map(([bucket, games]) => `
    <div class="section-label">${bucket}</div>
    ${games.map(g => {
      const selected = selectedIds.has(g.espnEventId);
      const hasLine = g.favorite && g.spread;
      const kickoffStr = g.kickoff ? new Date(g.kickoff).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}) : 'TBD';
      const dog = g.favorite === g.homeTeam ? g.awayTeam : g.homeTeam;
      return `
        <div class="picker-game-row ${selected ? 'picker-selected' : ''} ${g.started ? 'picker-started' : ''}"
             data-espnid="${escapeHtml(g.espnEventId)}" style="cursor:${g.started ? 'default' : 'pointer'};">
          <div style="display:flex; align-items:center; gap:10px; flex:1; min-width:0;">
            <div style="display:flex; flex-direction:column; align-items:center; gap:2px; flex-shrink:0;">
              ${renderTeamLogo(g.awayLogo, g.awayTeam)}
              ${renderTeamLogo(g.homeLogo, g.homeTeam)}
            </div>
            <div style="flex:1; min-width:0;">
              <div style="font-weight:700; font-size:13px; color:var(--text); line-height:1.4;">
                ${escapeHtml(g.awayTeam)} <span style="color:var(--text-faint); font-weight:400;">@</span> ${escapeHtml(g.homeTeam)}
              </div>
              <div style="font-size:11px; color:var(--text-faint); margin-top:2px;">
                ${kickoffStr}${g.started ? ' <span style="color:var(--loss);">● In Progress</span>' : ''}
              </div>
            </div>
          </div>
          <div style="text-align:right; flex-shrink:0; margin-left:8px; max-width:120px;">
            ${hasLine ? `
              <div class="mono" style="font-size:11px; font-weight:700; color:${g.hasSnapshot ? 'var(--gold)' : 'var(--text-soft)'}; line-height:1.3; word-break:break-word;">${escapeHtml(g.favorite)}</div>
              <div class="mono" style="font-size:12px; font-weight:700; color:${g.hasSnapshot ? 'var(--gold)' : 'var(--text-soft)'};">-${fmtSpread(g.spread)}</div>
              <div style="font-size:10px; margin-top:1px; color:${g.hasSnapshot ? 'var(--gold)' : 'var(--text-faint)'}; opacity:0.8;">
                ${g.hasSnapshot ? 'Opening line' : 'No opening line yet'}
              </div>
            ` : `<div style="font-size:11px; color:var(--text-faint);">No line yet</div>`}
          </div>
          <div class="picker-check ${selected ? 'picker-check-active' : ''}">
            ${selected ? '✓' : ''}
          </div>
        </div>`;
    }).join('')}
  `).join('');

  // wire click handlers
  listEl.querySelectorAll('.picker-game-row:not(.picker-started)').forEach(row => {
    row.onclick = () => {
      const espnId = row.dataset.espnid;
      const game = _pickerAllGames.find(g => g.espnEventId === espnId);
      if (!game) return;
      const idx = _pickerSelectedGames.findIndex(g => g.espnEventId === espnId);
      if (idx >= 0) {
        _pickerSelectedGames.splice(idx, 1); // deselect
      } else {
        const maxGames = Math.min(_pickerAllGames.length, 10);
        if (_pickerSelectedGames.length >= maxGames) {
          showToast(`You already have ${maxGames} games — deselect one first`, 'error');
          return;
        }
        _pickerSelectedGames.push(game);
      }
      updatePickerCount();
      renderPickerGamesList(week);
    };
  });
}

function kickoffBucket(kickoff) {
  if (!kickoff) return 'Time TBD';
  const h = new Date(kickoff).getHours();
  if (h < 12) return 'Morning Games';
  if (h < 15) return 'Afternoon Games';
  if (h < 18) return 'Late Afternoon Games';
  if (h < 20) return 'Evening Games';
  return 'Night Games';
}

function updatePickerCount() {
  const n = _pickerSelectedGames.length;
  const max = Math.min(_pickerAllGames.length || 10, 10);
  const badge = document.getElementById('picker-count-badge');
  const btn = document.getElementById('submit-slate-btn');
  if (badge) {
    badge.textContent = `${n} / ${max} selected`;
    badge.style.color = n === max ? 'var(--win)' : n > 0 ? 'var(--gold)' : 'var(--text)';
  }
  if (btn) {
    btn.disabled = n !== max;
    btn.textContent = n === max ? `Submit My ${max} Games ✓` : `Select ${max - n} More Game${max - n === 1 ? '' : 's'}`;
  }
}

async function submitSlate() {
  const week = currentWeek();
  const max = Math.min(_pickerAllGames.length || 10, 10);
  if (_pickerSelectedGames.length !== max) { showToast(`Select all ${max} games`, 'error'); return; }
  const btn = document.getElementById('submit-slate-btn');
  btn.innerHTML = '<span class="spinner" style="border-top-color:#1A1206;"></span>';
  try {
    await api('submitSlate', { week, games: _pickerSelectedGames });
    showToast('Slate submitted! The commissioner will review and post it.', 'success');
    _pickerSelectedGames = [];
    _pickerAllGames = [];
    await silentRefresh();
    renderContent();
  } catch(e) { btn.innerHTML = 'Submit My 10 Games'; }
}

/* ---- Posted board: players make their picks ---- */
function renderPicksBoard(content, week, games) {
  const existingPicks = getMyPicksForWeek(week);
  if (existingPicks.length > 0 && Object.keys(_draftPicks).length === 0) {
    existingPicks.forEach(p => {
      const isUpset = p.isUpset === true || p.isUpset === 'TRUE';
      _draftPicks[p.gameId] = { pickedTeam: p.pickedTeam, isUpset };
      if (isUpset && !games.find(g => g.gameId === p.gameId)) {
        // upset pick references a game outside this week's 10 -- find it in State.games to show details
        const extGame = State.games.find(g => g.gameId === p.gameId);
        if (extGame) {
          _upsetSelection = { espnEventId: extGame.espnEventId, awayTeam: extGame.awayTeam, homeTeam: extGame.homeTeam, favorite: extGame.favorite, spread: extGame.spread, kickoff: extGame.kickoff, pickedTeam: p.pickedTeam, gameId: extGame.gameId, homeLogo: extGame.homeLogo, awayLogo: extGame.awayLogo };
          _upsetMode = 'search';
        }
      }
    });
  }

  const straightCount = Object.keys(_draftPicks).filter(gid => _draftPicks[gid].pickedTeam).length;
  const hasUpset = Object.keys(_draftPicks).some(gid => _draftPicks[gid].isUpset) || _upsetSelection;

  content.innerHTML = `
    <div class="card" style="background:var(--surface-3); color:#fff;">
      <div class="flex-between">
        <div>
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.6);">Week ${week} Board</div>
          <div id="picked-count-display" style="font-family:var(--font-display); font-size:18px; margin-top:2px;">${straightCount} / ${games.length} picked</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.6);">Upset Special</div>
          <div id="upset-status-display" style="font-family:var(--font-display); font-size:18px; margin-top:2px; color:var(--gold);">${hasUpset ? 'Selected' : 'Not Set'}</div>
        </div>
      </div>
    </div>
    <div id="games-board"></div>
    <div class="section-label">Upset Special</div>
    ${isUpsetSpecialLocked(games) ? `
      <div class="card">
        <div style="font-size:13px; font-weight:700; color:var(--gold); margin-bottom:4px;">🔒 Upset Special Locked</div>
        <p class="helptext" style="line-height:1.6;">The Upset Special locks 5 minutes before the first game of the week. ${hasUpset ? `Your pick: <strong style="color:var(--gold);">${Object.keys(_draftPicks).find(gid => _draftPicks[gid].isUpset) ? _draftPicks[Object.keys(_draftPicks).find(gid => _draftPicks[gid].isUpset)].pickedTeam : (_upsetSelection ? _upsetSelection.pickedTeam : '—')}</strong>` : '<span style="color:var(--loss);">No Upset Special submitted — you will receive 0 upset points this week.</span>'}</p>
        ${isUpsetPicksRevealed(games) ? `
          <div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--hairline);">
            <div class="helptext" style="font-weight:700; margin-bottom:6px;">All Upset Picks Revealed:</div>
            ${(State.picks || []).filter(p => p.isUpset === true || p.isUpset === 'TRUE').map(p => {
              const pl = getPlayerById(p.playerId);
              const isDefault = p.isAutoDefault === true || p.isAutoDefault === 'TRUE';
              return `<div style="display:flex; justify-content:space-between; font-size:12px; padding:3px 0;">
                <span>${escapeHtml(pl ? (pl.teamName || pl.name) : '—')}</span>
                <span class="mono" style="color:var(--gold);">${escapeHtml(p.pickedTeam)} ⭐${isDefault ? ' *' : ''}</span>
              </div>`;
            }).join('')}
          </div>
        ` : '<p class="helptext" style="margin-top:8px; font-style:italic;">All upset picks will be revealed once the first game kicks off.</p>'}
      </div>
    ` : `
      <div class="card">
        <div class="tab-row">
          <button data-upsetmode="board" class="${_upsetMode === 'board' ? 'active' : ''}">From This Week's 10</button>
          <button data-upsetmode="search" class="${_upsetMode === 'search' ? 'active' : ''}">Search Any Game</button>
        </div>
        <div id="upset-search-area"></div>
      </div>
    `}
    ${isUpsetPicksRevealed(games) && games.every(g => isGameStarted(g)) ? '' : `
      <button class="btn btn-gold btn-block" id="submit-picks-btn" style="margin-top:6px;">
        ${existingPicks.length > 0 ? 'Update My Picks' : 'Submit My Picks'}
      </button>
    `}
    <p class="helptext" style="text-align:center; margin-top:10px;">Upset Special locks 5 mins before the first game. Straight picks lock per-game. Picks stay hidden until each game kicks off.</p>
  `;
  renderGamesBoard(games, week);
  renderUpsetSearchArea(week, games);
  content.querySelectorAll('[data-upsetmode]').forEach(btn => {
    btn.onclick = () => { _upsetMode = btn.dataset.upsetmode; renderPicksBoard(content, week, games); };
  });
  document.getElementById('submit-picks-btn').onclick = () => submitMyPicks(week, games);
}

function renderGamesBoard(games, week) {
  const wrap = document.getElementById('games-board');
  wrap.innerHTML = games.map(g => {
    const draft = _draftPicks[g.gameId] || {};
    const favTeam = g.favorite;
    const result = computeGameResult(g);
    const locked = isGamePickLocked(g);
    const started = isGameStarted(g);
    const isUpsetOnThisGame = draft.isUpset && draft.pickedTeam;
    // when upset is active on this game, show the underdog selected in gold;
    // when no upset, show whichever team is picked in the normal navy style
    const awaySelected = draft.pickedTeam === g.awayTeam && !draft.isUpset;
    const homeSelected = draft.pickedTeam === g.homeTeam && !draft.isUpset;
    const awayIsUpsetPick = draft.isUpset && draft.pickedTeam === g.awayTeam;
    const homeIsUpsetPick = draft.isUpset && draft.pickedTeam === g.homeTeam;

    let resultStrip = '';
    if (result.isFinal) {
      resultStrip = `
        <div class="result-strip">
          <span class="mono" style="color:var(--text-soft);">${escapeHtml(g.awayTeam)} ${result.awayScore} – ${result.homeScore} ${escapeHtml(g.homeTeam)}</span>
          ${draft.pickedTeam ? `<span class="result-pill ${draft.isUpset ? (result.winner === draft.pickedTeam ? 'upset-win' : 'loss') : (result.winner === draft.pickedTeam ? 'win' : 'loss')}">
            ${draft.isUpset ? (result.winner === draft.pickedTeam ? 'Upset hit +' + fmtSpread(g.spread) : 'Upset miss') : (result.winner === draft.pickedTeam ? 'Correct +1' : 'Incorrect')}
          </span>` : ''}
        </div>`;
    } else if (started) {
      // game has started but not final -- reveal everyone's picks for this game
      resultStrip = renderRevealedPicksForGame(g);
    }

    return `
      <div class="game-row ${isUpsetOnThisGame ? 'is-upset-selected' : ''}" data-gameid="${g.gameId}">
        <div class="flex-between" style="margin-bottom:6px;">
          ${renderCountdownBadge(g)}
        </div>
        <div class="game-matchup">
          <div class="team-pick ${awaySelected ? 'selected' : ''} ${awayIsUpsetPick ? 'upset-pick' : ''} ${locked ? 'is-locked' : ''}"
               data-gameid="${g.gameId}" data-team="${escapeHtml(g.awayTeam)}"
               style="${(locked || awayIsUpsetPick) ? 'cursor:default;' : ''}${locked ? ' opacity:0.55;' : ''}">
            <div class="team-logo-row">
              ${renderTeamLogo(g.awayLogo, g.awayTeam)}
              <div><div class="tname">${escapeHtml(g.awayTeam)}</div>${favTeam === g.awayTeam ? '<div class="fav-badge">Favorite</div>' : ''}</div>
            </div>
            <div class="tline">${favTeam === g.awayTeam ? '-' + fmtSpread(g.spread) : (favTeam ? '+' + fmtSpread(g.spread) : '—')}</div>
          </div>
          <div class="vs-divider">@</div>
          <div class="team-pick ${homeSelected ? 'selected' : ''} ${homeIsUpsetPick ? 'upset-pick' : ''} ${locked ? 'is-locked' : ''}"
               data-gameid="${g.gameId}" data-team="${escapeHtml(g.homeTeam)}"
               style="${(locked || homeIsUpsetPick) ? 'cursor:default;' : ''}${locked ? ' opacity:0.55;' : ''}">
            <div class="team-logo-row">
              ${renderTeamLogo(g.homeLogo, g.homeTeam)}
              <div><div class="tname">${escapeHtml(g.homeTeam)}</div>${favTeam === g.homeTeam ? '<div class="fav-badge">Favorite</div>' : ''}</div>
            </div>
            <div class="tline">${favTeam === g.homeTeam ? '-' + fmtSpread(g.spread) : (favTeam ? '+' + fmtSpread(g.spread) : '—')}</div>
          </div>
        </div>
        ${resultStrip}
      </div>
    `;
  }).join('');

  wrap.querySelectorAll('.team-pick').forEach(el => {
    if (el.style.cursor === 'default') return; // handles both locked games and upset-picked team
    el.onclick = () => {
      const gameId = el.dataset.gameid;
      const team = el.dataset.team;
      const game = games.find(g => g.gameId === gameId);
      if (isGamePickLocked(game)) { showToast('This game has locked', 'error'); return; }
      if (!_draftPicks[gameId]) _draftPicks[gameId] = {};
      _draftPicks[gameId].pickedTeam = team;
      // only clear the upset flag if they picked the favorite
      if (isFavorite(game, team)) {
        _draftPicks[gameId].isUpset = false;
      }
      renderGamesBoard(games, week);
      updateBoardHeader();
    };
  });
}

function renderRevealedPicksForGame(g) {
  const picksForGame = State.picks.filter(p => p.gameId === g.gameId);
  if (picksForGame.length === 0) return '<div class="result-strip"><span class="helptext">No picks revealed yet.</span></div>';
  const rows = picksForGame.map(p => {
    const player = getPlayerById(p.playerId);
    const isUpset = p.isUpset === true || p.isUpset === 'TRUE';
    return `<div style="display:flex; justify-content:space-between; font-size:12px; padding:3px 0;">
      <span>${escapeHtml(player ? (player.teamName || player.name) : '—')}</span>
      <span class="mono" style="color:${isUpset ? 'var(--gold)' : 'var(--text-soft)'};">${escapeHtml(p.pickedTeam)}${isUpset ? ' ⭐' : ''}</span>
    </div>`;
  }).join('');
  return `<div class="result-strip" style="flex-direction:column; align-items:stretch;"><div class="helptext" style="margin-bottom:4px; font-weight:700;">Picks revealed:</div>${rows}</div>`;
}

function renderUpsetSearchArea(week, games) {
  const area = document.getElementById('upset-search-area');
  if (_upsetMode === 'board') {
    area.innerHTML = games.map(g => {
      const draft = _draftPicks[g.gameId] || {};
      const dog = underdogOf(g);
      const active = draft.isUpset && draft.pickedTeam === dog;
      const locked = isGamePickLocked(g);
      return `
        <div class="upset-toggle ${active ? 'active' : ''}" data-gameid="${g.gameId}" data-dog="${escapeHtml(dog)}" style="${locked ? 'opacity:0.5;' : ''}">
          <div class="label"><span class="upset-checkbox">${active ? '✓' : ''}</span> ${escapeHtml(dog)} (underdog)</div>
          <div class="points">+${fmtSpread(g.spread)} pts</div>
        </div>`;
    }).join('');
    area.querySelectorAll('.upset-toggle').forEach(el => {
      el.onclick = () => {
        const gameId = el.dataset.gameid;
        const dog = el.dataset.dog;
        const game = games.find(g => g.gameId === gameId);
        if (isGamePickLocked(game)) { showToast('This game has locked', 'error'); return; }
        const wasActive = _draftPicks[gameId] && _draftPicks[gameId].isUpset;
        clearAllUpsetFlags(games.map(g => g.gameId));
        _upsetSelection = null;
        if (!wasActive) {
          if (!_draftPicks[gameId]) _draftPicks[gameId] = {};
          _draftPicks[gameId].pickedTeam = dog;
          _draftPicks[gameId].isUpset = true;
        }
        renderPicksBoard(document.getElementById('content'), week, games);
      };
    });
  } else {
    area.innerHTML = `
      <div class="field" style="margin-bottom:8px;">
        <input type="text" id="upset-search-input" placeholder="Search any team playing this week..." value="">
      </div>
      <div id="upset-search-results"></div>
      ${_upsetSelection ? `
        <div class="card" style="background:var(--surface-2); margin-top:8px;">
          <div class="helptext" style="font-weight:700; margin-bottom:6px;">Your Upset Special pick:</div>
          <div class="flex-between">
            <span style="font-weight:700; display:flex; align-items:center; gap:8px;">
              ${renderTeamLogo(_upsetSelection.pickedTeam === _upsetSelection.homeTeam ? _upsetSelection.homeLogo : _upsetSelection.awayLogo, _upsetSelection.pickedTeam)}
              ${escapeHtml(_upsetSelection.pickedTeam)}
            </span>
            <span class="mono">+${fmtSpread(_upsetSelection.spread)} pts</span>
          </div>
          <div class="helptext" style="margin-top:6px;">${escapeHtml(_upsetSelection.awayTeam)} @ ${escapeHtml(_upsetSelection.homeTeam)}</div>
          <button class="btn btn-ghost btn-sm" id="clear-upset-search-btn" style="margin-top:8px;">Clear</button>
        </div>
      ` : ''}
    `;
    const input = document.getElementById('upset-search-input');
    let debounceTimer;
    input.oninput = () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => runUpsetSearch(input.value, week, games), 400);
    };
    if (_upsetSelection) {
      document.getElementById('clear-upset-search-btn').onclick = () => {
        _upsetSelection = null;
        clearAllUpsetFlags(games.map(g => g.gameId));
        renderPicksBoard(document.getElementById('content'), week, games);
      };
    }
  }
}

function clearAllUpsetFlags(boardGameIds) {
  Object.keys(_draftPicks).forEach(gid => {
    if (!_draftPicks[gid]) return;
    _draftPicks[gid].isUpset = false;
    // if this game is not one of the 10 board games, remove it entirely --
    // it was an external search pick and should be wiped when switching back to a board upset
    if (boardGameIds && !boardGameIds.includes(gid)) {
      delete _draftPicks[gid];
    }
  });
}

async function runUpsetSearch(query, week, games) {
  if (query.trim().length < 2) { document.getElementById('upset-search-results').innerHTML = ''; return; }
  const resultsEl = document.getElementById('upset-search-results');
  resultsEl.innerHTML = '<div class="helptext">Searching...</div>';
  try {
    // always search the Monday snapshot -- never live ESPN -- so lines are always the opening line
    const data = await api('searchSnapshotGames', { query, week });
    _upsetSearchResults = data.results || [];

    if (!data.ok && data.error) {
      // no snapshot exists yet (board not posted, or posted before this feature was added)
      resultsEl.innerHTML = `<div class="helptext" style="color:var(--loss);">${escapeHtml(data.error)}</div>`;
      return;
    }
    if (_upsetSearchResults.length === 0) {
      resultsEl.innerHTML = '<div class="helptext">No games found in this week\'s line snapshot. Try another team name.</div>';
      return;
    }
    resultsEl.innerHTML = _upsetSearchResults.map((r, i) => `
      <div class="search-result-row" data-idx="${i}">
        <div style="display:flex; align-items:center; gap:10px;">
          <div style="display:flex; align-items:center;">
            ${renderTeamLogo(r.awayLogo, r.awayTeam)}
            <span style="margin-left:-6px; z-index:1;">${renderTeamLogo(r.homeLogo, r.homeTeam)}</span>
          </div>
          <div>
            <div class="matchup">${escapeHtml(r.awayTeam)} @ ${escapeHtml(r.homeTeam)}</div>
            <div style="display:flex; align-items:center; gap:6px; margin-top:2px;">
              <div class="helptext">${r.favorite ? escapeHtml(r.favorite) + ' favored' : 'No line'}</div>
              <span style="font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(242,182,50,0.15); color:var(--gold); font-weight:700; letter-spacing:0.04em;">MON LINE</span>
            </div>
          </div>
        </div>
        <div class="line">${r.favorite ? '+' + fmtSpread(r.spread) : '—'}</div>
      </div>
    `).join('');
    resultsEl.querySelectorAll('.search-result-row').forEach(row => {
      row.onclick = () => {
        const r = _upsetSearchResults[Number(row.dataset.idx)];
        if (!r.favorite) { showToast('This game has no line — try another', 'error'); return; }
        const dog = isFavorite({ favorite: r.favorite, homeTeam: r.homeTeam }, r.homeTeam) ? r.awayTeam : r.homeTeam;
        clearAllUpsetFlags(games.map(g => g.gameId));
        _upsetSelection = { espnEventId: r.espnEventId, awayTeam: r.awayTeam, homeTeam: r.homeTeam, favorite: r.favorite, spread: r.spread, kickoff: r.kickoff, pickedTeam: dog, homeLogo: r.homeLogo, awayLogo: r.awayLogo };
        renderPicksBoard(document.getElementById('content'), week, games);
      };
    });
  } catch (e) {
    resultsEl.innerHTML = '<div class="helptext">Search failed. Try again.</div>';
  }
}

function updateBoardHeader() {
  // count all games with a pick -- including the one with the upset flag
  const straightCount = Object.keys(_draftPicks).filter(gid => _draftPicks[gid].pickedTeam).length;
  const hasUpset = Object.keys(_draftPicks).some(gid => _draftPicks[gid].isUpset) || _upsetSelection;
  const countEl = document.getElementById('picked-count-display');
  const upsetEl = document.getElementById('upset-status-display');
  if (countEl) countEl.textContent = `${straightCount} / 10 picked`;
  if (upsetEl) upsetEl.textContent = hasUpset ? 'Selected' : 'Not Set';
}

async function submitMyPicks(week, games) {
  const picks = games.map(g => {
    const d = _draftPicks[g.gameId];
    if (!d || !d.pickedTeam) return null;
    return { gameId: g.gameId, pickedTeam: d.pickedTeam, isUpset: false };
  }).filter(Boolean);

  if (picks.length !== games.length) { showToast(`Pick all ${games.length} games before submitting`, 'error'); return; }

  let upsetPick = null;
  if (_upsetMode === 'board') {
    const upsetGameId = Object.keys(_draftPicks).find(gid => _draftPicks[gid].isUpset);
    if (!upsetGameId) { showToast('Select your Upset Special pick', 'error'); return; }
    upsetPick = { gameId: upsetGameId, pickedTeam: _draftPicks[upsetGameId].pickedTeam, isUpset: true };
  } else {
    if (!_upsetSelection) { showToast('Search and select your Upset Special pick', 'error'); return; }
    upsetPick = {
      gameId: _upsetSelection.gameId || '', espnEventId: _upsetSelection.espnEventId,
      awayTeam: _upsetSelection.awayTeam, homeTeam: _upsetSelection.homeTeam,
      favorite: _upsetSelection.favorite, spread: _upsetSelection.spread, kickoff: _upsetSelection.kickoff,
      pickedTeam: _upsetSelection.pickedTeam, isUpset: true,
      homeLogo: _upsetSelection.homeLogo, awayLogo: _upsetSelection.awayLogo
    };
  }
  picks.push(upsetPick);

  const btn = document.getElementById('submit-picks-btn');
  btn.innerHTML = '<span class="spinner" style="border-top-color:#1A1206;"></span>';
  try {
    await api('submitPicks', { week, playerId: State.player.id, picks });
    showToast('Picks locked in', 'success');
    await refreshState();
    renderContent();
  } catch (e) {
    btn.innerHTML = 'Submit My Picks';
  }
}
</script>
<script>
/* ============================================================
   STANDINGS VIEW (regular season)
   ============================================================ */
function underdogOf(game) {
  if (!game || !game.favorite) return game ? game.awayTeam : '';
  return game.favorite === game.homeTeam ? game.awayTeam : game.homeTeam;
}

function computeStandingsLocally() {
  const players = State.players.filter(p => p.active);
  const finalGames = State.games.filter(isGameFinal);
  const standings = {};
  players.forEach(p => standings[p.id] = {
    playerId: p.id, name: p.name, teamName: p.teamName,
    points: 0, correct: 0, upsetWins: 0, upsetAttempts: 0, weeklyBreakdown: {}
  });

  finalGames.forEach(g => {
    const result = computeGameResult(g);
    const dog = underdogOf(g);
    const spread = Number(g.spread) || 0;
    const gamePicks = State.picks.filter(p => p.gameId === g.gameId);
    gamePicks.forEach(p => {
      if (!standings[p.playerId]) return;
      const wk = Number(p.week);
      if (!standings[p.playerId].weeklyBreakdown[wk]) standings[p.playerId].weeklyBreakdown[wk] = 0;
      const isUpset = p.isUpset === true || p.isUpset === 'TRUE';
      if (isUpset) {
        standings[p.playerId].upsetAttempts += 1;
        if (result.winner === dog) {
          standings[p.playerId].points += spread;
          standings[p.playerId].upsetWins += 1;
          standings[p.playerId].weeklyBreakdown[wk] += spread;
        }
      } else if (result.winner === p.pickedTeam) {
        standings[p.playerId].points += 1;
        standings[p.playerId].correct += 1;
        standings[p.playerId].weeklyBreakdown[wk] += 1;
      }
    });
  });

  return Object.values(standings).sort((a, b) => b.points - a.points);
}

function renderStandings(content) {
  const standings = computeStandingsLocally();
  const week = currentWeek();

  // find all completed weeks from games data
  const completedWeeks = [...new Set(
    (State.games || [])
      .filter(g => isGameFinal(g))
      .map(g => Number(g.week))
  )].sort((a, b) => a - b);

  const activeTab = State._standingsTab || 'season';

  content.innerHTML = `
    <div style="display:flex; gap:0; border-bottom:1px solid var(--hairline); margin-bottom:12px; overflow-x:auto;">
      <button class="tab-btn ${activeTab === 'season' ? 'active' : ''}" data-tab="season">Season</button>
      <button class="tab-btn ${activeTab === 'weekly' ? 'active' : ''}" data-tab="weekly">By Week</button>
      <button class="tab-btn ${activeTab === 'mine' ? 'active' : ''}" data-tab="mine">My History</button>
      <button class="tab-btn ${activeTab === 'career' ? 'active' : ''}" data-tab="career">Career</button>
    </div>
    <div id="standings-tab-content"></div>
  `;

  content.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      State._standingsTab = btn.dataset.tab;
      renderStandings(content);
    };
  });

  const tabContent = document.getElementById('standings-tab-content');

  if (activeTab === 'season') {
    renderSeasonStandings(tabContent, standings, completedWeeks);
  } else if (activeTab === 'weekly') {
    renderWeeklyHistory(tabContent, standings, completedWeeks);
  } else if (activeTab === 'career') {
    renderCareerStandings(tabContent);
  } else {
    renderMyHistory(tabContent, completedWeeks);
  }
}

function renderSeasonStandings(el, standings, completedWeeks) {
  el.innerHTML = standings.length === 0
    ? '<div class="empty-state"><p>No completed games yet this season.</p></div>'
    : `
      <div class="card" style="padding:0; overflow:hidden;">
        ${standings.map((s, i) => `
          <div class="standing-row ${i === 0 ? 'rank-1' : ''}" style="padding:12px 16px; border-bottom:${i < standings.length-1 ? '1px solid var(--hairline)' : 'none'};">
            <div class="standing-rank" style="color:${i === 0 ? 'var(--gold)' : i === 1 ? 'var(--text-soft)' : i === 2 ? '#cd7f32' : 'var(--text-faint)'};">${i + 1}</div>
            <div style="flex:1;">
              <div class="standing-name" data-player-id="${s.playerId}" style="cursor:pointer;display:flex;align-items:center;gap:6px;">
                ${(() => { const yrs = getChampionYearsForPlayer(s.playerId); return yrs.length ? `<span style="font-size:11px;font-weight:800;background:linear-gradient(135deg,#9A6A00,#FFD700,#9A6A00);color:#1A0800;padding:1px 6px;border-radius:20px;white-space:nowrap;">${escapeHtml(yrs.join(', '))} 👑</span>` : ''; })()}
                ${escapeHtml(s.teamName || s.name)}
              </div>
              <div class="standing-meta">${escapeHtml(s.name)} &middot; ${s.correct} correct &middot; ${s.upsetWins}/${s.upsetAttempts} upsets hit</div>
            </div>
            <div style="text-align:right;">
              <div class="standing-points ${i === 0 ? 'pulse-update' : ''}">${s.points % 1 === 0 ? s.points : s.points.toFixed(1)}</div>
              ${completedWeeks.length > 0 ? `<div class="helptext" style="font-size:10px; margin-top:2px;">${completedWeeks.map(w => {
                const pts = s.weeklyBreakdown[w] || 0;
                return `<span title="Week ${w}" style="margin-left:4px; color:${pts >= 8 ? 'var(--win)' : pts >= 5 ? 'var(--gold)' : 'var(--text-faint)'};">${pts % 1 === 0 ? pts : pts.toFixed(1)}</span>`;
              }).join('')}</div>` : ''}
            </div>
          </div>
        `).join('')}
      </div>
      <p class="helptext" style="text-align:center; margin-top:8px;">1 pt per correct pick &middot; Upset Special pays the spread if underdog wins outright</p>
    `;
}

function renderWeeklyHistory(el, standings, completedWeeks) {
  if (completedWeeks.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No completed weeks yet.</p></div>';
    return;
  }

  const selectedWeek = State._historyWeek || completedWeeks[completedWeeks.length - 1];

  // compute week winner and stats
  const weekStandings = standings
    .map(s => ({ ...s, weekPoints: s.weeklyBreakdown[selectedWeek] || 0 }))
    .filter(s => s.weekPoints > 0 || true)
    .sort((a, b) => b.weekPoints - a.weekPoints);

  const weekGames = (State.games || []).filter(g => Number(g.week) === selectedWeek && isGameFinal(g));
  const weekPicks = (State.picks || []).filter(p => Number(p.week) === selectedWeek);

  el.innerHTML = `
    <div class="card" style="padding:10px 14px;">
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${completedWeeks.map(w => `
          <button class="btn btn-sm ${w === selectedWeek ? 'btn-primary' : 'btn-ghost'}" data-week="${w}">Week ${w}</button>
        `).join('')}
      </div>
    </div>

    ${weekGames.length > 0 ? `
      <div class="section-label">Week ${selectedWeek} Results</div>
      <div class="card" style="padding:0; overflow:hidden;">
        ${weekGames.map(g => {
          const result = computeGameResult(g);
          const dog = underdogOf(g);
          return `
            <div style="padding:10px 14px; border-bottom:1px solid var(--hairline); display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:13px; font-weight:700; color:var(--text);">${escapeHtml(g.awayTeam)} @ ${escapeHtml(g.homeTeam)}</div>
                <div class="helptext">${escapeHtml(g.favorite)} -${fmtSpread(g.spread)} &middot; Dog: ${escapeHtml(dog)}</div>
              </div>
              <div style="text-align:right;">
                <div class="mono" style="font-size:14px; font-weight:700; color:${result.winner === dog ? 'var(--gold)' : 'var(--text)'};">
                  ${result.awayScore} – ${result.homeScore}
                </div>
                <div class="helptext" style="color:${result.winner === dog ? 'var(--gold)' : 'var(--text-faint)'};">
                  ${result.winner === dog ? '🚨 UPSET' : escapeHtml(result.winner) + ' wins'}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    ` : ''}

    <div class="section-label">Week ${selectedWeek} Scores</div>
    <div class="card" style="padding:0; overflow:hidden;">
      ${weekStandings.slice(0, 10).map((s, i) => `
        <div style="padding:10px 14px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:10px;">
          <div style="width:20px; text-align:center; color:var(--text-faint); font-weight:700;">${i + 1}</div>
          <div style="flex:1;">
            <div style="font-size:13px; font-weight:700; color:var(--text);">${escapeHtml(s.teamName || s.name)}</div>
          </div>
          <div class="mono" style="font-weight:700; color:${i === 0 ? 'var(--gold)' : 'var(--text)'};">${s.weekPoints % 1 === 0 ? s.weekPoints : s.weekPoints.toFixed(1)}</div>
        </div>
      `).join('')}
    </div>
  `;

  el.querySelectorAll('[data-week]').forEach(btn => {
    btn.onclick = () => { State._historyWeek = Number(btn.dataset.week); renderWeeklyHistory(el, standings, completedWeeks); };
  });
}

function renderMyHistory(el, completedWeeks) {
  const myId = State.player.id;
  if (completedWeeks.length === 0) {
    el.innerHTML = '<div class="empty-state"><p>No completed weeks yet.</p></div>';
    return;
  }

  const selectedWeek = State._myHistoryWeek || completedWeeks[completedWeeks.length - 1];
  const weekGames = (State.games || []).filter(g => Number(g.week) === selectedWeek && g.source !== 'external');
  const myPicks = (State.picks || []).filter(p => p.playerId === myId && Number(p.week) === selectedWeek);
  const myUpset = myPicks.find(p => p.isUpset === true || p.isUpset === 'TRUE');

  let weekPts = 0, correct = 0;
  const rows = weekGames.map(g => {
    const result = computeGameResult(g);
    const myPick = myPicks.find(p => p.gameId === g.gameId);
    const dog = underdogOf(g);
    const isUpsetPick = myUpset && myUpset.gameId === g.gameId;
    let pts = 0, status = '—';
    if (result.isFinal && myPick) {
      if (isUpsetPick) {
        if (result.winner === dog) { pts = Number(g.spread); status = `+${fmtSpread(g.spread)} 🚨`; }
        else { pts = 0; status = 'Upset miss'; }
      } else {
        if (result.winner === myPick.pickedTeam) { pts = 1; correct++; status = '+1'; }
        else { status = 'Miss'; }
      }
    }
    weekPts += pts;
    return { g, result, myPick, isUpsetPick, pts, status, dog };
  });

  el.innerHTML = `
    <div class="card" style="padding:10px 14px;">
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        ${completedWeeks.map(w => `
          <button class="btn btn-sm ${w === selectedWeek ? 'btn-primary' : 'btn-ghost'}" data-week="${w}">Week ${w}</button>
        `).join('')}
      </div>
    </div>

    <div class="card" style="display:flex; gap:0; padding:0; overflow:hidden;">
      <div style="flex:1; text-align:center; padding:14px 8px; border-right:1px solid var(--hairline);">
        <div class="mono" style="font-size:24px; font-weight:700; color:var(--gold);">${weekPts % 1 === 0 ? weekPts : weekPts.toFixed(1)}</div>
        <div class="helptext">Points</div>
      </div>
      <div style="flex:1; text-align:center; padding:14px 8px; border-right:1px solid var(--hairline);">
        <div class="mono" style="font-size:24px; font-weight:700; color:var(--text);">${correct}/${weekGames.length}</div>
        <div class="helptext">Correct</div>
      </div>
      <div style="flex:1; text-align:center; padding:14px 8px;">
        <div class="mono" style="font-size:24px; font-weight:700; color:${myUpset ? 'var(--gold)' : 'var(--text-faint)'};">${myUpset ? '✓' : '—'}</div>
        <div class="helptext">Upset Pick</div>
      </div>
    </div>

    <div class="section-label">Week ${selectedWeek} — My Picks</div>
    <div class="card" style="padding:0; overflow:hidden;">
      ${rows.length === 0 ? '<div style="padding:16px; text-align:center;" class="helptext">No picks on record for this week.</div>' :
        rows.map(({ g, result, myPick, isUpsetPick, pts, status, dog }) => `
          <div style="padding:10px 14px; border-bottom:1px solid var(--hairline); display:flex; align-items:center; gap:10px;">
            <div style="flex:1;">
              <div style="font-size:12px; font-weight:700; color:var(--text);">${escapeHtml(g.awayTeam)} @ ${escapeHtml(g.homeTeam)}</div>
              <div class="helptext" style="margin-top:2px;">
                My pick: <strong style="color:${isUpsetPick ? 'var(--gold)' : 'var(--text)'};">${myPick ? escapeHtml(myPick.pickedTeam) : 'No pick'}</strong>
                ${isUpsetPick ? ' 🚨 Upset Special' : ''}
              </div>
              ${result.isFinal ? `<div class="helptext" style="margin-top:2px; color:var(--text-faint);">Final: ${result.awayScore}–${result.homeScore} &middot; Winner: ${escapeHtml(result.winner)}</div>` : ''}
            </div>
            <div class="mono" style="font-weight:700; color:${pts > 0 ? 'var(--win)' : status === 'Miss' || status === 'Upset miss' ? 'var(--loss)' : 'var(--text-faint)'}; font-size:14px; flex-shrink:0;">${status}</div>
          </div>
        `).join('')}
    </div>
  `;

  el.querySelectorAll('[data-week]').forEach(btn => {
    btn.onclick = () => { State._myHistoryWeek = Number(btn.dataset.week); renderMyHistory(el, completedWeeks); };
  });
}

async function renderCareerStandings(el) {
  el.innerHTML = '<div class="empty-state"><span class="spinner"></span><p style="margin-top:12px;">Loading career data…</p></div>';

  if (!State._careerHistory) {
    try {
      const data = await api('getCareerHistory');
      State._careerHistory = data.history || [];
    } catch(e) {
      el.innerHTML = '<div class="empty-state"><p>Could not load career data.</p></div>';
      return;
    }
  }

  const history = State._careerHistory;
  if (!history.length) {
    el.innerHTML = '<div class="empty-state"><p>No career history loaded yet.</p></div>';
    return;
  }

  const years = [...new Set(history.map(r => r.year))].sort((a, b) => a - b);
  const selectedYear = State._careerYear || 'all';

  // --- compute season podiums (1st/2nd/3rd per year) ---
  // key: playerId or teamName -> array of finish positions
  const podiums = {}; // key -> {gold:0, silver:0, bronze:0}
  years.forEach(yr => {
    const yrRows = history.filter(r => r.year === yr);
    const yrSorted = [...yrRows].sort((a, b) => b.points - a.points);
    yrSorted.forEach((r, idx) => {
      const key = r.playerId || r.teamName;
      if (!podiums[key]) podiums[key] = { gold: 0, silver: 0, bronze: 0 };
      if (idx === 0) podiums[key].gold++;
      else if (idx === 1) podiums[key].silver++;
      else if (idx === 2) podiums[key].bronze++;
    });
  });

  // --- compute perfect weeks from current season's picks/games ---
  // A perfect week = player picked all games correctly in a week
  const perfectWeeks = {}; // playerId -> count
  const completedWeeks = [...new Set(
    (State.games || []).filter(g => isGameFinal(g)).map(g => Number(g.week))
  )];
  completedWeeks.forEach(wk => {
    const wkGames = getGamesForWeek(wk).filter(g => isGameFinal(g));
    if (!wkGames.length) return;
    (State.players || []).forEach(p => {
      const myPicks = (State.picks || []).filter(pk => pk.playerId === p.id && Number(pk.week) === wk);
      const straight = myPicks.filter(pk => !(pk.isUpset === true || pk.isUpset === 'TRUE'));
      let allCorrect = straight.length === wkGames.length;
      if (allCorrect) {
        wkGames.forEach(g => {
          const result = computeGameResult(g);
          const pick = straight.find(pk => pk.gameId === g.gameId);
          if (!pick || result.winner !== pick.pickedTeam) allCorrect = false;
        });
      }
      if (allCorrect) {
        perfectWeeks[p.id] = (perfectWeeks[p.id] || 0) + 1;
      }
    });
  });

  // --- aggregate career totals ---
  const totals = {};
  history.forEach(r => {
    if (selectedYear !== 'all' && r.year !== selectedYear) return;
    const key = r.playerId || r.teamName;
    if (!totals[key]) {
      totals[key] = {
        key, name: r.name, teamName: r.teamName,
        playerId: r.playerId, matched: r.matched,
        total: 0, seasons: {}, seasonCount: 0
      };
    }
    totals[key].total += r.points;
    totals[key].seasons[r.year] = r.points;
    totals[key].seasonCount++;
  });

  const rows = Object.values(totals).sort((a, b) => b.total - a.total);

  const fmtPts = p => p % 1 === 0 ? String(p) : p.toFixed(1);
  const podiumBadge = (p) => {
    if (!p) return '';
    const parts = [];
    if (p.gold)   parts.push(`<span style="font-size:11px;" title="${p.gold}x 1st place">🥇×${p.gold}</span>`);
    if (p.silver) parts.push(`<span style="font-size:11px;" title="${p.silver}x 2nd place">🥈×${p.silver}</span>`);
    if (p.bronze) parts.push(`<span style="font-size:11px;" title="${p.bronze}x 3rd place">🥉×${p.bronze}</span>`);
    return parts.length ? `<span style="display:inline-flex; gap:4px; margin-left:4px;">${parts.join('')}</span>` : '';
  };

  el.innerHTML = `
    <div class="card" style="padding:10px 14px;">
      <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
        <button class="btn btn-sm ${selectedYear === 'all' ? 'btn-primary' : 'btn-ghost'}" data-year="all">All Time</button>
        ${years.map(y => `<button class="btn btn-sm ${selectedYear === y ? 'btn-primary' : 'btn-ghost'}" data-year="${y}">${y}</button>`).join('')}
      </div>
    </div>

    <div class="section-label">${selectedYear === 'all' ? 'All-Time Leaderboard' : selectedYear + ' Season'}</div>
    <div class="card" style="padding:0; overflow:hidden;">
      ${rows.length === 0 ? '<div style="padding:16px;" class="helptext">No data for this year.</div>' :
        rows.map((r, i) => {
          const isMe = r.playerId === State.player.id;
          const avg = r.seasonCount > 0 ? (r.total / r.seasonCount) : 0;
          const pod = podiums[r.key];
          const perfCount = perfectWeeks[r.playerId] || 0;

          // sparkline dots (all-time view only)
          const spark = years.map(y => {
            const p = r.seasons[y] || 0;
            const color = p >= 120 ? 'var(--win)' : p >= 80 ? 'var(--gold)' : p > 0 ? 'var(--text-faint)' : 'rgba(255,255,255,0.08)';
            const border = p === 0 ? '1px solid rgba(255,255,255,0.1)' : 'none';
            return `<span title="${y}: ${p ? fmtPts(p) : '—'}" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:${color}; border:${border}; margin:0 1px;"></span>`;
          }).join('');

          const rankColor = i === 0 ? 'var(--gold)' : i === 1 ? '#C0C0C0' : i === 2 ? '#cd7f32' : 'var(--text-faint)';
          const rankLabel = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;

          return `
            <div style="padding:12px 14px; border-bottom:1px solid var(--hairline); ${isMe ? 'background:rgba(255,186,0,0.06);' : ''}">
              <div style="display:flex; align-items:center; gap:10px;">
                <div style="width:28px; text-align:center; font-size:${i < 3 ? '18px' : '13px'}; font-weight:700; color:${rankColor}; flex-shrink:0;">${rankLabel}</div>

                  <div style="font-size:13px; font-weight:700; color:${isMe ? 'var(--gold)' : 'var(--text)'}; display:flex; align-items:center; flex-wrap:wrap; gap:4px;">
                    <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" data-player-id="${r.playerId || ''}" style="cursor:pointer;">${escapeHtml(r.teamName)}${isMe ? ' ★' : ''}</span>
                    ${selectedYear === 'all' ? podiumBadge(pod) : ''}
                    ${perfCount > 0 ? `<span style="font-size:11px;" title="${perfCount} perfect week${perfCount > 1 ? 's' : ''} this season">💯×${perfCount}</span>` : ''}
                    ${!r.matched ? '<span style="color:var(--text-faint); font-size:10px; font-style:italic;">(unlinked)</span>' : ''}
                  </div>
                  <div class="helptext" style="margin-top:2px;">${escapeHtml(r.name)}</div>
                  ${selectedYear === 'all' ? `
                    <div style="display:flex; align-items:center; gap:8px; margin-top:5px;">
                      <span class="helptext">Avg: <strong style="color:var(--text);">${fmtPts(avg)}</strong>/season</span>
                      <span class="helptext">${r.seasonCount} season${r.seasonCount !== 1 ? 's' : ''}</span>
                    </div>
                    <div style="margin-top:5px;">${spark}</div>
                  ` : `
                    <div class="helptext" style="margin-top:2px;">${selectedYear} season</div>
                  `}
                </div>
                <div style="text-align:right; flex-shrink:0;">
                  <div class="mono" style="font-size:18px; font-weight:700; color:${isMe ? 'var(--gold)' : i === 0 ? 'var(--gold)' : 'var(--text)'};">${fmtPts(r.total)}</div>
                  ${selectedYear === 'all' ? `<div class="helptext" style="font-size:10px;">pts total</div>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('')}
    </div>

    ${!history.every(r => r.matched) ? '<p class="helptext" style="text-align:center; margin-top:8px; font-style:italic;">Some historical names aren\'t linked to current players yet.</p>' : ''}
  `;

  wirePlayerNameTaps(el);
  el.querySelectorAll('[data-year]').forEach(btn => {
    btn.onclick = () => {
      State._careerYear = btn.dataset.year === 'all' ? 'all' : Number(btn.dataset.year);
      renderCareerStandings(el);
    };
  });
}

  // --- Avatar upload ---

    const file = e.target.files[0];
    if (!file) return;
    // compress to max 150px and convert to base64
    const reader = new FileReader();
    reader.onload = async (ev) => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const MAX = 150;
        const ratio = Math.min(MAX / img.width, MAX / img.height);
        canvas.width  = Math.round(img.width  * ratio);
        canvas.height = Math.round(img.height * ratio);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const b64 = canvas.toDataURL('image/jpeg', 0.75);
        try {
          await api('updateProfile', { playerId: p.id, avatar: b64 });
          State.player.avatar = b64;
          // update the avatar wrapper in place
          document.getElementById('avatar-wrapper').innerHTML = `

          await refreshState();
        } catch(e) { showToast('Could not save avatar: ' + e.message, 'error'); }

      img.src = ev.target.result;

  };

  // --- Change PIN ---
